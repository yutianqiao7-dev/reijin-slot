<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>L 覚醒スロット REIJIN</title>
<style>
:root{--h:60px;--gold:#ffcc33;--red:#ff2d3d;--panel:#14121c;--line:#2a2638}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);background:radial-gradient(120% 60% at 50% 0%,#3a1208 0%,#12060a 45%,#07070c 100%)}
/* top data counter */
#top{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:4px;align-items:stretch}
.dc{background:#0c0b12;border:1px solid var(--line);border-radius:6px;padding:3px 6px;line-height:1.1}
.dc small{display:block;font-size:9px;color:#9a93b0}
.dc b{font-family:"DSEG7 Classic",Consolas,monospace;font-size:15px;color:#ff9a3c;letter-spacing:.5px}
.dc b.neg{color:#6fb8ff}
.tbtn{background:#241f33;border:1px solid #3b3452;border-radius:6px;font-size:11px;padding:0 8px}
/* LCD */
#lcdWrap{position:relative;border-radius:10px;padding:5px;background:linear-gradient(135deg,#6b4b12,#e8c15a 30%,#6b4b12 60%,#d8b04a);box-shadow:0 0 18px #ff6a0033}
#lcd{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#000;transition:box-shadow .2s}
#lcdBg{position:absolute;inset:0;transition:background 1s}
.bg-normal-low #lcdBg{background:linear-gradient(#0b1633,#1b2a52 60%,#27304a)}
.bg-normal-high #lcdBg{background:linear-gradient(#2c1438,#6a2a3c 60%,#8a4a2a)}
.bg-normal-super #lcdBg{background:linear-gradient(#3a0010,#9a1020 55%,#ff5a1a)}
.bg-zencho #lcdBg{background:linear-gradient(#f4f0e6,#c9c1ad 55%,#6d6254)}
.bg-cz #lcdBg{background:radial-gradient(circle at 50% 60%,#39c6ff,#08306a 60%,#020b1c)}
.bg-at #lcdBg{background:radial-gradient(circle at 50% 70%,#ff8a1a,#8a1a00 55%,#1a0400)}
.bg-upper #lcdBg{background:linear-gradient(120deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff,#ff3bd0);background-size:400% 400%;animation:rb 6s linear infinite}
.bg-battle #lcdBg{background:linear-gradient(90deg,#2a0600,#000 50%,#060a2a)}
.bg-bonus #lcdBg{background:radial-gradient(circle,#fff3a0,#ffb400 40%,#6a3a00)}
.bg-tokka #lcdBg{background:radial-gradient(circle at 50% 40%,#ffd1ea,#ff5aa8 45%,#3a0020)}
.bg-hiki #lcdBg{background:linear-gradient(#1a1a1a,#3a3a4a)}
@keyframes rb{0%{background-position:0% 50%}100%{background-position:100% 50%}}
#lcd::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 55%,#000a 100%)}
.bg-zencho #lcdMain{color:#16161e}.bg-zencho #lcdTitle,.bg-zencho #lcdSub{text-shadow:0 0 6px #fff,0 0 12px #fff}
#scene,#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scene>div{position:absolute;inset:0;overflow:hidden;animation:scIn .8s ease}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes scIn{from{opacity:0;transform:scale(1.06)}}
.rays{position:absolute;left:50%;top:58%;width:230%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--ray) 0 5deg,transparent 5deg 15deg);animation:spin 26s linear infinite;opacity:.3;mix-blend-mode:screen}
.rays.rb{background:repeating-conic-gradient(#ff3b3b 0 5deg,transparent 5deg 12deg,#fffa6b 12deg 17deg,transparent 17deg 24deg,#3bff8a 24deg 29deg,transparent 29deg 36deg,#3bd4ff 36deg 41deg,transparent 41deg 48deg,#c05bff 48deg 53deg,transparent 53deg 60deg);opacity:.4}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sp{transform-box:fill-box;transform-origin:center;animation:spin2 14s linear infinite}
.sp.r{animation-direction:reverse;animation-duration:9s}
@keyframes spin2{to{transform:rotate(360deg)}}
.flick{animation:flick .25s steps(2) infinite alternate}
@keyframes flick{to{opacity:.75;transform:translateY(1px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.ch{position:absolute;bottom:0;height:92%;width:48%;display:flex;align-items:flex-end;justify-content:center;transition:transform .4s,opacity .4s}
#chL{left:0}#chR{right:0}
.ch img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 8px #0008)}
.ph{height:88%;aspect-ratio:3/4;border-radius:10px 10px 0 0;background:linear-gradient(160deg,var(--c),var(--d));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #ffffff55;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;width:46%;aspect-ratio:1;border-radius:50%;top:12%;background:#0005}
.ph::after{content:"";position:absolute;width:80%;height:45%;bottom:-6%;border-radius:50% 50% 0 0;background:#0005}
.ph span{position:relative;z-index:1;font-weight:900;font-size:clamp(12px,4vw,20px);text-shadow:0 2px 4px #000;writing-mode:vertical-rl;margin-top:14%}
.ph small{position:relative;z-index:1;font-size:8px;opacity:.8;margin-top:auto;margin-bottom:6px}
#lcdTop{position:absolute;left:0;right:0;top:0;padding:4px 8px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:6px;background:linear-gradient(#000a,transparent);z-index:3;text-shadow:0 1px 2px #000}
#lcdTop .ttl{font-size:13px;letter-spacing:1px}
#lcdMain{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:3;pointer-events:none}
#lcdTitle{font-size:clamp(18px,6vw,28px);font-weight:900;text-shadow:0 0 10px #000,0 2px 2px #000;letter-spacing:2px}
#lcdSub{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;margin-top:2px}
#gauge{position:absolute;left:10%;right:10%;bottom:8%;height:10px;border:2px solid #fff;border-radius:6px;background:#0008;display:none;z-index:3}
#gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39c6ff,#fff);border-radius:3px;transition:width .5s}
#hp{position:absolute;left:4%;right:4%;top:30px;display:none;gap:8%;z-index:3}
#hp>div{flex:1;height:8px;background:#0009;border:1px solid #fff;border-radius:4px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;transition:width .6s}
#hp .hpa i{background:linear-gradient(90deg,#ffb31a,#ff6a00)}
#hp .hpe i{background:linear-gradient(90deg,#ff2d55,#8a0020);margin-left:auto}
#cut{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;align-items:center;overflow:hidden}
#cut.show{display:flex;animation:cutin 1.3s ease both}
#cut .cc{height:100%;width:45%;display:flex;align-items:flex-end;justify-content:center}
#cut .cc img{max-height:100%;max-width:100%}
#cut .ct{flex:1;font-size:clamp(16px,5vw,24px);font-weight:900;text-shadow:0 0 8px #000,0 2px 0 #000;padding-right:8px}
#cut.lv1{background:linear-gradient(100deg,transparent 5%,#1a6bffcc 30%,#1a6bffcc 70%,transparent 95%)}
#cut.lv2{background:linear-gradient(100deg,transparent 5%,#19c25acc 30%,#19c25acc 70%,transparent 95%)}
#cut.lv3{background:linear-gradient(100deg,transparent 5%,#ff1a2ecc 30%,#ff1a2ecc 70%,transparent 95%)}
#cut.lv4{background:linear-gradient(100deg,transparent 5%,#ffc400ee 30%,#ffc400ee 70%,transparent 95%)}
#cut.lv4 .ct{color:#3a1a00;text-shadow:0 0 6px #fff}
#cut.lv5{background:linear-gradient(100deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff,#ff3bd0)}
@keyframes cutin{0%{transform:translateX(100%)}15%{transform:translateX(0)}85%{transform:translateX(0);opacity:1}100%{transform:translateX(-30%);opacity:0}}
#ov{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000c}
#ov.show{display:flex;animation:pop .35s ease}
#ov .ovc{height:62%;display:flex;gap:4px;align-items:flex-end;justify-content:center}
#ov .ovc>*{height:100%}
#ov .ovc img{height:100%;object-fit:contain}
#ov .ovt{font-size:clamp(22px,8vw,40px);font-weight:900;letter-spacing:2px;text-shadow:0 0 12px currentColor,0 2px 0 #000}
#ov .ovs{font-size:14px;font-weight:700;margin-top:4px}
#ov.gold{background:radial-gradient(circle,#ffe27acc,#6a3a00ee)}#ov.gold .ovt{color:#fff6c8}
#ov.red{background:radial-gradient(circle,#ff3b3bcc,#2a0000ee)}
#ov.blue{background:radial-gradient(circle,#39c6ffcc,#001a3aee)}
#ov.pink{background:radial-gradient(circle,#ff9ad0cc,#3a0020ee)}
#ov.dark{background:#000d}#ov.dark .ovt{color:#888}
#ov.rainbow{background:linear-gradient(120deg,#ff3b3bdd,#ffb33bdd,#fffa6bdd,#3bff8add,#3bd4ffdd,#8a5bffdd,#ff3bd0dd);background-size:400% 400%;animation:pop .35s ease,rb 2s linear infinite}
#ov.rainbow .ovt{color:#fff;text-shadow:0 0 6px #000,0 2px 0 #000}
#ov.ending{background:linear-gradient(#000,#1a0f2a)}
#ov.pre .ovt{animation:blink .5s steps(2) infinite;color:#ffec3b}
@keyframes pop{from{transform:scale(1.15);opacity:0}}
@keyframes blink{50%{opacity:.25}}
#lcd.fx1{box-shadow:inset 0 0 0 4px #1a6bff}#lcd.fx2{box-shadow:inset 0 0 0 4px #19c25a}#lcd.fx3{box-shadow:inset 0 0 0 4px #ff1a2e}#lcd.fx4{box-shadow:inset 0 0 0 4px #ffc400}#lcd.fx5{box-shadow:inset 0 0 0 4px #fff}
#lcd.freeze{filter:brightness(0)}
body.freezeBody .reel{filter:brightness(.2)}
/* lamps */
#lamps{display:flex;align-items:center;justify-content:space-between;padding:0 4px;font-size:10px;color:#9a93b0}
#logo{font-weight:900;font-size:14px;letter-spacing:3px;background:linear-gradient(#fff,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
#logo.on{background:linear-gradient(90deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff);background-size:300%;-webkit-background-clip:text;background-clip:text;animation:rb 1.5s linear infinite}
.lamp{display:inline-flex;align-items:center;gap:4px}
.lamp i{width:8px;height:8px;border-radius:50%;background:#333;display:inline-block}
.lamp.on i{background:#ff3b3b;box-shadow:0 0 6px #ff3b3b}
.bets i{width:14px;height:6px;border-radius:2px;background:#333;display:inline-block;margin-left:2px}
.bets.on i{background:#ffcc33;box-shadow:0 0 5px #ffcc33}
/* nav & reels */
#navbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:28px}
#navbar div{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;border-radius:6px;background:#0c0b12;border:1px solid var(--line);color:#333}
#navbar div.on{color:#fff;background:#b3006b;border-color:#ff5ab8;box-shadow:0 0 10px #ff5ab8;animation:blink .6s steps(2) infinite}
#navbar div.aim{color:#ff2d3d;background:#fff;border-color:#ff2d3d;font-size:13px}
#reelBox{position:relative;background:#0b0a10;border-radius:10px;padding:6px;border:2px solid #3a2a12;box-shadow:inset 0 0 20px #000}
#reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reel{position:relative;height:calc(var(--h)*3);overflow:hidden;border-radius:6px;background:linear-gradient(90deg,#bdb6a8,#fffdf6 30%,#fffdf6 70%,#bdb6a8)}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(#000a,transparent 25%,transparent 75%,#000a);pointer-events:none}
.strip{will-change:transform}
.cell{height:var(--h);display:flex;align-items:center;justify-content:center}
.cell svg{height:86%;width:86%}
#cline{position:absolute;left:4px;right:4px;top:50%;height:0;border-top:1px dashed #ff2d3d88;pointer-events:none}
#pay{position:absolute;right:10px;bottom:-2px;transform:translateY(100%);font-family:Consolas,monospace;font-size:12px;color:#ff9a3c}
/* controls */
#ctrl{display:grid;grid-template-columns:78px 1fr;gap:8px;margin-top:10px;align-items:center}
#lever{width:78px;height:78px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#fff,#ff3b3b 35%,#7a0010);box-shadow:0 4px 0 #3a0008,0 0 12px #ff3b3b66;font-weight:900;font-size:12px}
#lever:active{transform:translateY(3px);box-shadow:0 1px 0 #3a0008}
#stops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stop{height:64px;border-radius:12px;border:2px solid #333;background:#1a1822;font-weight:900;font-size:13px;color:#555}
.stop.on{border-color:#ff5a3c;background:radial-gradient(circle at 50% 35%,#ff9a6b,#c21a00 60%,#5a0a00);color:#fff;box-shadow:0 0 10px #ff5a3c88}
.stop:active{transform:scale(.96)}
#row2{display:grid;grid-template-columns:1fr 1fr 96px 1fr 1fr;gap:6px;align-items:center}
.sbtn{height:40px;border-radius:8px;border:1px solid #3b3452;background:#1d1a28;font-size:12px;font-weight:700}
.sbtn.act{background:#ff6a00;border-color:#ffb36b;color:#000}
#push{height:52px;border-radius:26px;border:2px solid #555;background:radial-gradient(circle at 50% 30%,#666,#222);font-weight:900;letter-spacing:1px}
#push.on{border-color:#fff;background:radial-gradient(circle at 50% 30%,#fffa6b,#ff3b3b 50%,#8a00ff);animation:blink .35s steps(2) infinite;box-shadow:0 0 18px #fffa6b}
#toast{position:fixed;left:50%;bottom:20%;transform:translateX(-50%);background:#000d;border:1px solid #ff9a3c;padding:8px 14px;border-radius:8px;font-size:13px;display:none;z-index:50;max-width:90%}
/* modal */
#modal{position:fixed;inset:0;background:#000b;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#modal.hide{display:none}
.mbox{width:100%;max-width:480px;max-height:86vh;background:#15131d;border-radius:14px 14px 0 0;display:flex;flex-direction:column;border-top:2px solid #ff9a3c}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.mhead button{background:none;border:none;font-size:20px}
#mbody{overflow:auto;padding:12px 14px 24px;font-size:13px}
.prompt,.prompt *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#mbody h3{font-size:14px;margin:14px 0 6px;color:#ffb36b}
#mbody table{width:100%;border-collapse:collapse;font-size:12px}
#mbody td,#mbody th{border-bottom:1px solid var(--line);padding:4px;text-align:left}
#mbody td.r{text-align:right;font-family:Consolas,monospace}
.grid6{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sw{min-width:64px}
.charRow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.charRow .th{width:52px;height:64px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:6px;background:#0b0a10}
.charRow .th img{max-width:100%;max-height:100%}
.charRow .th .ph{height:100%}
.charRow .th .ph span{font-size:10px}
.prompt{background:#0b0a10;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:11px;white-space:pre-wrap;line-height:1.5}
.hl{color:#ff9a3c}
#mbody canvas{width:100%;background:#0b0a10;border-radius:6px}
.hist{font-size:12px}
.hist div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--line)}
.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:10px;margin-right:4px;background:#333}
/* ---- 演出 ---- */
#lcdWrap{transition:box-shadow .3s}
#lcdWrap.lamp1{box-shadow:0 0 22px #1a6bff,0 0 6px #1a6bff}
#lcdWrap.lamp2{box-shadow:0 0 22px #19c25a,0 0 6px #19c25a}
#lcdWrap.lamp3{box-shadow:0 0 26px #ff1a2e,0 0 8px #ff1a2e}
#lcdWrap.lamp4{box-shadow:0 0 30px #ffc400,0 0 10px #ffc400}
#lcdWrap.lamp5{animation:lampRb 1s linear infinite}
@keyframes lampRb{0%{box-shadow:0 0 30px #ff3b3b}25%{box-shadow:0 0 30px #fffa6b}50%{box-shadow:0 0 30px #3bff8a}75%{box-shadow:0 0 30px #3bd4ff}100%{box-shadow:0 0 30px #ff3bd0}}
.shake{animation:shake .45s}
@keyframes shake{10%,50%,90%{transform:translate(-5px,2px)}30%,70%{transform:translate(5px,-2px)}}
#lcd.bo{filter:brightness(0);transition:filter .15s}
#step{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0008;gap:8px}
#step.show{display:flex}
#step .stt{font-weight:900;font-size:18px;letter-spacing:4px;text-shadow:0 0 8px #fff}
#step .boxes{display:flex;gap:6px}
#step i{width:44px;height:18px;border:2px solid #fff5;border-radius:4px;transition:all .15s}
#step i.on{border-color:#fff;transform:scale(1.15)}
#step i.l1.on{background:#1a6bff}#step i.l2.on{background:#19c25a}#step i.l3.on{background:#ff1a2e}#step i.l4.on{background:#ffc400}
#step i.l5.on{background:linear-gradient(90deg,#ff3b3b,#fffa6b,#3bff8a,#3bd4ff,#ff3bd0)}
#serif{position:absolute;left:4%;right:4%;bottom:5%;z-index:6;padding:6px 10px;border-radius:8px;background:#000d;border:2px solid #fff;font-weight:900;font-size:14px;display:none}
#serif.show{display:block;animation:pop .3s}
#serif small{display:block;font-size:10px;opacity:.8}
#serif.l1{border-color:#1a6bff;color:#8fb8ff}#serif.l2{border-color:#19c25a;color:#7dffab}#serif.l3{border-color:#ff1a2e;color:#ff6b78}
#serif.l4{border-color:#ffc400;color:#ffd84a}
#serif.l5{border-color:#fff;color:#fff;background:linear-gradient(90deg,#ff3b3bcc,#ffb33bcc,#3bff8acc,#3bd4ffcc,#ff3bd0cc)}
#gimmick{position:absolute;left:50%;top:-50%;transform:translateX(-50%);z-index:7;display:none;flex-direction:column;align-items:center;justify-content:center;width:46%;aspect-ratio:2/1;border-radius:14px;border:3px solid #fff;background:linear-gradient(#3a2a12,#000)}
#gimmick b{font-size:clamp(22px,8vw,36px);letter-spacing:4px;color:#ffe27a;text-shadow:0 0 10px #ffb400}
#gimmick small{font-size:10px;letter-spacing:4px;color:#fff}
#gimmick.drop{display:flex;animation:gdrop 1.1s cubic-bezier(.3,1.5,.5,1) both}
#gimmick.l4{box-shadow:0 0 30px #ffc400;border-color:#ffc400}
#gimmick.l5{animation:gdrop 1.1s cubic-bezier(.3,1.5,.5,1) both,lampRb .6s linear infinite}
@keyframes gdrop{0%{top:-50%}55%{top:24%}70%{top:16%}85%{top:24%}100%{top:24%}}
.reel.flash{animation:rflash .14s steps(2) 6}
.reel.flash2{animation:rflash2 .5s linear 2}
@keyframes rflash{50%{filter:brightness(2) saturate(1.6)}}
@keyframes rflash2{0%{filter:hue-rotate(0) brightness(1.6)}100%{filter:hue-rotate(360deg) brightness(1.6)}}
.reel.dim{filter:brightness(.15)}
.stop.on.c2{background:radial-gradient(circle at 50% 35%,#8affb0,#0a8a3a 60%,#003a14);border-color:#3bff8a}
.stop.on.c3{background:radial-gradient(circle at 50% 35%,#ff8a8a,#e0001a 60%,#4a0008);border-color:#fff;box-shadow:0 0 14px #ff1a2e}
.stop.on.c4{background:radial-gradient(circle at 50% 35%,#fff6c8,#ffc400 55%,#6a4a00);border-color:#fff;color:#3a2000;box-shadow:0 0 16px #ffc400}
.stop.on.c5{background:linear-gradient(120deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff);background-size:300%;animation:rb 1s linear infinite;border-color:#fff}
#push.on.p3{background:radial-gradient(circle at 50% 30%,#ff8a8a,#e0001a 55%,#4a0008)}
#push.on.p4{background:radial-gradient(circle at 50% 30%,#fff6c8,#ffc400 55%,#6a4a00);color:#3a2000}
.rbar{width:70%;height:14px;border:2px solid #fff;border-radius:8px;margin-top:10px;overflow:hidden;background:#0008}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffec3b,#ff3b3b);transition:width .1s}
#lcdTitle.big{font-size:clamp(40px,14vw,64px)}

/* image store (IndexedDB) */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('reijinSlot',1);r.onupgradeneeded=()=>r.result.createObjectStore('img');r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>res();}catch(e){res();}});},
  tx(mode,fn){return new Promise(res=>{try{if(!this.db)return res(null);const t=this.db.transaction('img',mode);const st=t.objectStore('img');const q=fn(st);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null);}catch(e){res(null);}});},
  get(k){return this.tx('readonly',s=>s.get(k));},put(k,v){return this.tx('readwrite',s=>s.put(v,k));},del(k){return this.tx('readwrite',s=>s.delete(k));}
};
function probe(url){return new Promise(res=>{const i=new Image();i.onload=()=>res(true);i.onerror=()=>res(false);i.src=url;});}
async function loadImages(){
  await DB.open();
  for(const id in CHARS){
    const d=await DB.get(id);
    if(d){imgSrc[id]=d;continue;}
    for(const ext of['png','webp','jpg','jpeg']){const u=`assets/chars/${id}.${ext}`;if(await probe(u)){imgSrc[id]=u;break;}}
  }
  lastChars={};render();
}
async function fileToDataURL(file){
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const max=720,sc=Math.min(1,max/Math.max(img.width,img.height));
  const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(img.src);
  return cv.toDataURL('image/png');
}

/* ================= reels ================= */
const N=21;
const STRIPS=['7rbcrbsrbBrbcrbsrb7rb','7rbsrbBrbsrb7rbBrbsrb','7brsbrBbrsbr7brsbrBbr'].map(s=>s.split(''));
const SVG={
 '7':'<svg viewBox="0 0 100 80"><text x="50" y="70" text-anchor="middle" font-size="80" font-weight="900" font-family="Arial Black,Impact,sans-serif" fill="#e8142b" stroke="#300" stroke-width="3" paint-order="stroke">7</text></svg>',
 'B':'<svg viewBox="0 0 100 80"><rect x="6" y="18" width="88" height="44" rx="6" fill="#111" stroke="#c9a23a" stroke-width="3"/><text x="50" y="52" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" font-family="sans-serif">覚醒</text></svg>',
 'b':'<svg viewBox="0 0 100 80"><path d="M50 6C32 6 28 24 28 40L20 58H80L72 40C72 24 68 6 50 6Z" fill="#ffd400" stroke="#8a6d00" stroke-width="3"/><circle cx="50" cy="66" r="7" fill="#ffd400" stroke="#8a6d00" stroke-width="3"/></svg>',
 'r':'<svg viewBox="0 0 100 80"><rect x="4" y="22" width="92" height="36" rx="18" fill="#e8f3ff" stroke="#1a4fd1" stroke-width="3"/><text x="50" y="48" text-anchor="middle" font-size="19" font-weight="900" fill="#1a4fd1" font-family="Arial,sans-serif">REPLAY</text></svg>',
 'c':'<svg viewBox="0 0 100 80"><path d="M36 50Q44 20 66 8M64 50Q62 26 66 8" stroke="#1f7a2a" stroke-width="4" fill="none"/><circle cx="34" cy="58" r="15" fill="#d6001c" stroke="#5a0010" stroke-width="3"/><circle cx="66" cy="58" r="15" fill="#d6001c" stroke="#5a0010" stroke-width="3"/><circle cx="29" cy="53" r="4" fill="#fff9"/><circle cx="61" cy="53" r="4" fill="#fff9"/></svg>',
 's':'<svg viewBox="0 0 100 80"><ellipse cx="50" cy="42" rx="32" ry="30" fill="#1f9d3a" stroke="#0a3a14" stroke-width="3"/><path d="M50 12V72M32 18Q22 42 32 66M68 18Q78 42 68 66" stroke="#0a3a14" stroke-width="5" fill="none"/></svg>',
};
const sym=(r,i)=>STRIPS[r][((i%N)+N)%N];
function classify(c){
  const w=r=>[sym(r,c[r]-1),sym(r,c[r]),sym(r,c[r]+1)];
  const a=w(0),b=w(1),d=w(2),m0=a[1],m1=b[1],m2=d[1],res=[];
  if(m0==='7'&&m1==='7'&&m2==='7')res.push('BB');else if(m0==='7'&&m1==='7'&&m2==='B')res.push('PREM');
  if(m0==='r'&&m1==='r'&&m2==='r')res.push('REP');
  if(m0==='b'&&m1==='b'&&m2==='b')res.push('BELL');
  if(m0==='s'&&m1==='s'&&m2==='s')res.push('SUI_S');
  else if((a[2]==='s'&&m1==='s'&&d[0]==='s')||(a[0]==='s'&&m1==='s'&&d[2]==='s'))res.push('SUI_W');
  if(m0==='r'&&m1==='b'&&m2==='r')res.push('CHANCE');
  if(m0==='c')res.push('CHE_S');else if(a[0]==='c'||a[2]==='c')res.push('CHE_W');
  return res.length?res.join('+'):'NONE';
}
const FLAG_TARGET={HAZURE:'NONE',REP:'REP',CHE_W:'CHE_W',CHE_S:'CHE_S',SUI_W:'SUI_W',SUI_S:'SUI_S',CHANCE:'CHANCE',FREEZE:'PREM',BB:'BB'};
const maxSlide=t=>(S.assist&&t!=='NONE')?20:4;
function reachScore(c,rem,t){
  const ms=maxSlide(t);
  if(rem.length===1){
    const r=rem[0],ach=[];
    for(let i=0;i<N;i++){c[r]=i;ach[i]=classify(c)===t;}
    let ok=0;for(let p=0;p<N;p++)for(let k=0;k<=ms;k++)if(ach[(p-k+N)%N]){ok++;break;}
    return ok/N;
  }
  const[r1,r2]=rem,ach=new Array(N*N);
  for(let i=0;i<N;i++){c[r1]=i;for(let j=0;j<N;j++){c[r2]=j;ach[i*N+j]=classify(c)===t;}}
  let ok=0;
  for(let p1=0;p1<N;p1++)for(let p2=0;p2<N;p2++){
    let f=false;
    for(let k1=0;k1<=ms&&!f;k1++){const i=(p1-k1+N)%N;for(let k2=0;k2<=ms;k2++)if(ach[i*N+(p2-k2+N)%N]){f=true;break;}}
    if(f)ok++;
  }
  return ok/(N*N);
}
function chooseStop(ri,press,centers,t){
  const rem=[0,1,2].filter(r=>r!==ri&&centers[r]==null);
  const evalT=tt=>{let best=null,bs=-1;
    for(let k=0;k<=maxSlide(tt);k++){
      const idx=(press-k+N*2)%N,c=centers.slice();c[ri]=idx;
      let sc;
      if(!rem.length){const key=classify(c);sc=key===tt?2:(key==='NONE'?1:0);}
      else sc=reachScore(c,rem,tt);
      if(sc>bs+1e-9){bs=sc;best=idx;}
    }return[best,bs];};
  let[best,bs]=evalT(t);
  if(bs<=0&&t!=='NONE')[best]=evalT('NONE');
  return best;
}

/* ================= sound ================= */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
const sfx={
  t(f,d,type='square',v=.05,delay=0,slide){if(!S.sound)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;
    o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);
    g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.03);}catch(e){}},
  lever(){this.t(160,.08,'square',.07);this.t(80,.15,'sawtooth',.05,.03);},
  stop(){this.t(1400,.035,'square',.045);},
  pay(n){for(let i=0;i<Math.min(n,15);i++)this.t(1900,.03,'square',.025,i*.045);},

  },
  pickSong(){
    if(!S.sound||!S.bgm||document.hidden||!AC)return null;
    const m=M.mode;
    if(m==='BONUS'||m==='TOKKA'||(m==='AT'&&M.at&&M.at.upper))return'FANFARE';

  },

    const sg=this.pickSong();if(sg===this.song)return;
    clearInterval(this.timer);this.timer=null;this.song=sg;this.step=0;if(!sg)return;
    const song=this.songs[sg],dur=60/song.bpm/4;
    this.timer=setInterval(()=>{
      const i=this.step++%16,b=song.bass[i],l=song.lead[i],f=n=>440*Math.pow(2,(n-69)/12);
      if(b)sfx.t(f(b),dur*.9,'triangle',.035);

/* ================= reel view ================= */
const R=[];let H=60;
function buildReels(){
  const wrap=$('#reels');
  for(let r=0;r<3;r++){
    const reel=document.createElement('div');reel.className='reel';
    const strip=document.createElement('div');strip.className='strip';
    for(let k=0;k<24;k++){const cell=document.createElement('div');cell.className='cell';cell.innerHTML=SVG[sym(r,k-1)];strip.appendChild(cell);}
    reel.appendChild(strip);wrap.appendChild(reel);
    R.push({el:reel,strip,pos:rint(N),state:'stop',target:0});
  }
  measure();
}
function measure(){
  const avail=window.innerHeight;const h=Math.max(44,Math.min(72,Math.floor((avail-470)/3)));
  document.documentElement.style.setProperty('--h',h+'px');H=h;
}
const SPEED=26;let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  for(const rl of R){
    if(rl.state==='spin'){rl.pos-=SPEED*dt;if(rl.pos<0)rl.pos+=N;}
    else if(rl.state==='rev'){rl.pos+=SPEED*.5*dt;if(rl.pos>=N)rl.pos-=N;}
    else if(rl.state==='stopping'){
      const remain=((rl.pos-rl.target)%N+N)%N,step=SPEED*dt;
      if(remain<=step){rl.pos=rl.target;rl.state='stop';onReelStopped();}
      else{rl.pos-=step;if(rl.pos<0)rl.pos+=N;}
    }
    rl.strip.style.transform=`translateY(${-rl.pos*H}px)`;
  }
  FX.step(dt);
  requestAnimationFrame(frame);
}

/* ================= LCD背景: SVGの景色 + canvasパーティクル ================= */
function lcg(seed){let v=seed;return()=>(v=(v*1664525+1013904223)%4294967296)/4294967296;}
const svgWrap=(inner,defs='')=>`<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMax slice"><defs>${defs}</defs>${inner}</svg>`;
function skyline(seed,base,col,win,hMin,hMax,wMin,wMax,broken){
  const r=lcg(seed);let x=-3,o='';
  while(x<163){
    const w=wMin+r()*(wMax-wMin),h=hMin+r()*(hMax-hMin),top=base-h;
    if(broken)o+=`<polygon points="${x},${base+2} ${x},${top+r()*6} ${x+w*.4},${top} ${x+w*.6},${top+4+r()*8} ${x+w},${top+r()*5} ${x+w},${base+2}" fill="${col}"/>`;
    else o+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(h+2).toFixed(1)}" fill="${col}"/>`;
    if(win)for(let wy=top+3;wy<base-3;wy+=4)for(let wx=x+1.5;wx<x+w-2;wx+=3)if(r()<.3)o+=`<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="1.3" height="1.8" fill="${win}" opacity="${(.45+r()*.55).toFixed(2)}"/>`;
    x+=w+r()*1.5;
  }
  return o;
}
function glowDef(id,col){return`<radialGradient id="${id}"><stop offset="0" stop-color="${col}" stop-opacity=".9"/><stop offset=".35" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></radialGradient>`;}
function sceneTown(k){
  const C={low:{orb:'#fff6d0',far:'#1c2d5e',near:'#060a16',win:'#ffd76a'},high:{orb:'#ffb347',far:'#5a2440',near:'#1a0812',win:'#ffcf7a'},super:{orb:'#ff2d3d',far:'#4a0010',near:'#100003',win:'#ff6b6b'}}[k];
  const orb=k==='high'

const FX={cv:null,c:null,w:1,h:1,ps:[],mode:'',t:0,flash:0,nextEv:3,shoot:null,bolt:null,
  N:{'bg-normal-low':45,'bg-normal-high':28,'bg-normal-super':40,'bg-zencho':28,'bg-cz':60,'bg-at':55,'bg-upper':65,'bg-battle':26,'bg-bonus':50,'bg-tokka':36,'bg-hiki':80},
  init(){this.cv=$('#fxc');this.c=this.cv.getContext('2d');this.resize();},
  resize(){if(!this.cv)return;const r=$('#lcd').getBoundingClientRect();if(!r.width)return;const d=Math.min(2,window.devicePixelRatio||1);
    this.w=r.width;this.h=r.height;this.cv.width=Math.round(r.width*d);this.cv.height=Math.round(r.height*d);this.c.setTransform(d,0,0,d,0,0);
    const m=this.mode;this.mode='';this.set(m);},
  set(m){if(m===this.mode)return;this.mode=m;this.ps=[];this.shoot=null;this.bolt=null;this.flash=0;for(let i=0;i<(this.N[m]||0);i++)this.ps.push(this.spawn(true));},
  spawn(init){
    const w=this.w,h=this.h,m=this.mode,p={x:rnd()*w,y:rnd()*h,s:1,ph:rnd()*6.28,rot:rnd()*6.28,vr:0,vx:0,vy:0,hue:rnd()*360};
    switch(m){
      case'bg-normal-low':p.y=rnd()*h*.55;p.s=.4+rnd()*1.1;break;
      case'bg-normal-high':case'bg-normal-super':if(!init)p.y=h+5;p.vy=-(8+rnd()*(m==='bg-normal-super'?45:18));p.vx=(rnd()-.5)*6;p.s=.7+rnd()*1.5;break;
      case'bg-zencho':if(!init)p.y=-5;p.vy=6+rnd()*10;p.vx=4+rnd()*6;p.s=1+rnd()*1.6;p.vr=(rnd()-.5)*3;break;
      case'bg-cz':p.r=init?rnd()*w*.6:w*.5+rnd()*w*.15;p.ang=rnd()*6.28;p.s=.8+rnd()*1.4;break;
      case'bg-at':case'bg-upper':if(!init)p.y=h+5;p.vy=-(40+rnd()*90);p.vx=(rnd()-.5)*20;p.s=.8+rnd()*1.6;break;
      case'bg-battle':{const d=rnd()<.5?1:-1;if(!init)p.x=d>0?-60:w+60;p.vx=d*(260+rnd()*320);p.len=20+rnd()*50;break;}
      case'bg-bonus':if(!init)p.y=h+5;p.vy=-(10+rnd()*25);p.s=1+rnd()*2.2;break;
      case'bg-tokka':if(!init)p.y=-8;p.vy=12+rnd()*18;p.vx=8+rnd()*14;p.s=2+rnd()*2.4;p.vr=(rnd()-.5)*4;break;
      case'bg-hiki':if(!init)p.y=-10;p.vy=240+rnd()*120;p.vx=-45;p.len=6+rnd()*8;break;
    }

  },
  step(dt){
    if(!this.c||!this.mode)return;
    const c=this.c,w=this.w,h=this.h,m=this.mode,t=(this.t+=dt);
    c.clearRect(0,0,w,h);
    c.globalCompositeOperation=(m==='bg-zencho'||m==='bg-hiki'||m==='bg-tokka')?'source-over':'lighter';
    for(let i=0;i<this.ps.length;i++){
      const p=this.ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;let out=false;
      switch(m){

        case'bg-normal-high':case'bg-normal-super':{p.x+=Math.sin(t*2+p.ph)*.3;const col=m==='bg-normal-super'?'255,60,50':'255,170,70';
          c.fillStyle=`rgba(${col},.18)`;c.beginPath();c.arc(p.x,p.y,p.s*3.2,0,6.28);c.fill();c.fillStyle=`rgba(${col},.9)`;c.beginPath();c.arc(p.x,p.y,p.s,0,6.28);c.fill();out=p.y<-8;break;}
        case'bg-zencho':c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='rgba(120,112,100,.45)';c.fillRect(-p.s,-p.s/2,p.s*2,p.s);c.restore();out=p.y>h+6||p.x>w+6;break;
        case'bg-cz':{p.ang+=dt*(1.2+40/(p.r+12));p.r-=dt*(14+w*.06);const x=w/2+Math.cos(p.ang)*p.r,y=h*.56+Math.sin(p.ang)*p.r*.55,a=Math.min(1,p.r/(w*.3));
          c.fillStyle=`rgba(140,240,255,${.25+.75*(1-a)})`;c.beginPath();c.arc(x,y,p.s,0,6.28);c.fill();out=p.r<3;break;}
        case'bg-at':case'bg-upper':{const col=m==='bg-upper'?`hsla(${(p.hue+t*140)%360},100%,65%,.95)`:`hsla(${28+p.ph*4},100%,${55+p.s*8}%,.95)`;
          c.strokeStyle=col;c.lineWidth=p.s;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);c.stroke();out=p.y<-12;break;}
        case'bg-battle':c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-Math.sign(p.vx)*p.len,p.y);c.stroke();out=p.x<-80||p.x>w+80;break;
        case'bg-bonus':{const a=.3+.7*Math.abs(Math.sin(t*3+p.ph)),r=p.s*2.2;c.save();c.translate(p.x,p.y);c.rotate(t+p.ph);c.fillStyle=`rgba(255,230,120,${a})`;
          c.fillRect(-r,-.5,r*2,1);c.fillRect(-.5,-r,1,r*2);c.beginPath();c.arc(0,0,p.s*.7,0,6.28);c.fill();c.restore();out=p.y<-8;break;}
        case'bg-tokka':p.x+=Math.sin(t*1.8+p.ph)*.5;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='rgba(255,183,213,.92)';c.beginPath();c.ellipse(0,0,p.s*1.5,p.s*.8,0,0,6.28);c.fill();
          c.fillStyle='rgba(255,120,170,.6)';c.beginPath();c.ellipse(p.s*.6,0,p.s*.5,p.s*.3,0,0,6.28);c.fill();c.restore();out=p.y>h+10||p.x>w+10;break;
        case'bg-hiki':c.strokeStyle='rgba(170,190,225,.35)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+p.vx*.03,p.y+p.len);c.stroke();out=p.y>h+10;break;

      if(m==='bg-normal-super'||m==='bg-battle'){this.flash=1;const pts=[[w*(.2+rnd()*.6),0]];while(pts[pts.length-1][1]<h*.8)pts.push([pts[pts.length-1][0]+(rnd()-.5)*30,pts[pts.length-1][1]+10+rnd()*18]);this.bolt=pts;}
    }
    if(this.shoot){const s=this.shoot;s.life+=dt;const x=s.x-s.life*180,y=s.y+s.life*70,g=c.createLinearGradient(x,y,x+40,y-16);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=g;c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x+40,y-16);c.stroke();if(s.life>.8)this.shoot=null;}
    if(this.flash>0){
      if(this.bolt&&this.flash>.6){c.strokeStyle=`rgba(255,240,255,${this.flash})`;c.lineWidth=1.8;c.beginPath();this.bolt.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
      c.globalCompositeOperation='source-over';c.fillStyle=`rgba(255,255,255,${this.flash*.35})`;c.fillRect(0,0,w,h);this.flash=Math.max(0,this.flash-dt*2.5);
    }
  }
};

/* ================= game flow ================= */
let G=null,busy=false,auto=false,lastLever=0;
function rollFlag(){
  const s=M.setting;
  const t={BELL:.58,REP:1/7.3,CHE_W:1/(86-2*s),CHE_S:1/260,SUI_W:1/95,SUI_S:1/300,CHANCE:1/190,FREEZE:1/16384};
  let r=rnd();for(const k in t){r-=t[k];if(r<0)return k;}return'HAZURE';
}
const isW=f=>f==='CHE_W'||f==='SUI_W';
const isS=f=>f==='CHE_S'||f==='SUI_S'||f==='CHANCE';
function preGame(){
  const p={flag:rollFlag(),order:null,nav:false,aim7:false};
  if(M.mode==='AT'&&M.at&&M.at.pendingBB&&['HAZURE','BELL','REP'].includes(p.flag))p.flag='BB';
  if(p.flag==='BELL'){p.order=pick(ORDERS);if(AT_MODES.includes(M.mode))p.nav=true;}
  if(p.flag==='BB')p.aim7=true;
  return p;
}
function curTarget(g){
  if(g.flag==='BELL'){for(let i=0;i<g.stopOrder.length;i++)if(g.stopOrder[i]!==g.order[i])return'NONE';return'BELL';}
  return FLAG_TARGET[g.flag];
}
async function lever(){
  if(busy||G)return;
  ac();
  if(!M.replay){
    if(M.credits<3){toast('メダルが足りません → 右上の「貸出」');stopAuto();return;}
    M.credits-=3;M.inT+=3;
  }
  busy=true;M.replay=false;
  if(S.wait){const w=4100-(performance.now()-lastLever);if(w>0){$('#lever').textContent='WAIT';await sleep(w);$('#lever').textContent='LEVER';}}
  lastLever=performance.now();
  const p=preGame();
  G=Object.assign(p,{stopOrder:[],centers:[null,null,null],ready:false,stopped:0});
  const done=new Promise(res=>G.resolve=res);
  $('#pay').textContent='';
  render();sfx.lever();
  showNav(G);BGM.update();await leverFx(G);
  if(p.flag==='FREEZE')await freezeFx();
  R.forEach(r=>r.state='spin');
  await sleep(280);G.ready=true;updStops();
  if(auto)autoStops();
  await done;
  const key=classify(G.centers);
  endFx(G,key);
  const pay=settle(p,key);
  const g=G;G=null;clearNav();updStops();
  await postGame(g,key,pay);
  if(M.games%M.gstep===0){M.graph.push(diff());if(M.graph.length>6000){M.graph=M.graph.filter((_,i)=>i%2===0);M.gstep*=2;}}
  M.maxDiff=Math.max(M.maxDiff,diff());
  save();render();busy=false;
  if(auto)setTimeout(()=>{if(auto)lever();},220);
}
function pressStop(r){
  if(!G||!G.ready)return;const rl=R[r];if(rl.state!=='spin')return;
  const press=((Math.floor(rl.pos))%N+N)%N;
  G.stopOrder.push(r);
  const idx=chooseStop(r,press,G.centers,curTarget(G));
  G.centers[r]=idx;rl.target=idx;rl.state='stopping';sfx.stop();
  stopFx();
  const nd=$('#navbar').children[r];nd.classList.remove('on');
  updStops();
}
function onReelStopped(){if(G){G.stopped++;if(G.stopped===3)G.resolve();}}
function autoStops(){const o=(G.nav&&G.order)?G.order:[0,1,2];o.forEach((r,i)=>setTimeout(()=>pressStop(r),160+i*150));}
function settle(p,key){
  let pay=0,rep=false;
  for(const k of key.split('+')){
    if(k==='BELL')pay+=9;else if(k==='CHE_W'||k==='CHE_S')pay+=2;else if(k==='SUI_W'||k==='SUI_S')pay+=6;
    else if(k==='CHANCE'||k==='PREM')pay+=1;else if(k==='REP')rep=true;
  }
  if(p.flag==='BELL'&&key==='NONE')pay+=1;
  M.credits+=pay;M.outT+=pay;M.replay=rep;
  if(rep){sfx.replay();$('#pay').textContent='REPLAY';}else if(pay){sfx.pay(pay);$('#pay').textContent='PAY '+pay;}
  return pay;
}

  el.innerHTML=`<div class="cc">${charHTML(id)}</div><div class="ct">${text}</div>`;sfx.cut(l);clearTimeout(cutT);cutT=setTimeout(()=>el.className='',1300);}

/* 期待度: 0=なし 1=青 2=緑 3=赤 4=金 5=虹(確定) */
function calcHeat(g){
  const f=g.flag;let h=0,sure=false;
  if(f==='FREEZE')return{h:5,sure:true};
  if(f==='BB'){h=4;sure=true;}else if(isS(f))h=3;else if(isW(f))h=2;
  switch(M.mode){
    case'NORMAL':if(M.kk==='super'&&h)h++;break;
    case'ZENCHO':if(M.zc.result==='AT'){h+=h?2:1;sure=true;}else if(M.zc.result==='CZ'&&h)h+=1;break;
    case'CZ':if(M.cz.won&&h){h+=1;sure=true;}break;
    case'BATTLE':if(M.battle.win&&h){h+=1;sure=true;}break;
    case'HIKI':if(M.hiki.win&&h){h+=1;sure=true;}break;
  }
  return{h:Math.min(4,h),sure};
}
function fxLevel(g){
  const{h,sure}=calcHeat(g);
  if(g.flag==='FREEZE'||g.flag==='BB')return 5;
  if(h===0)return rnd()<.06?(rnd()<.8?1:2):0;
  if(rnd()>.35+h*.15)return 0;
  let l=Math.max(1,h-(rnd()<.4?1:0));
  if(sure&&h>=3&&rnd()<.1)l=5;
  return l;
}

      M.at.upper=true;M.at.keizoku=Math.max(M.at.keizoku,85);M.at.stock+=2;

    case'ZENCHO':await pZencho(f,W,Sg);break;
    case'CZ':await pCZ(f,W,Sg);break;
    case'AT':await pAT(f,W,Sg,key);break;
    case'BATTLE':await pBattle(f,W,Sg);break;
    case'BONUS':await pBonus(f,W,Sg);break;
    case'TOKKA':await pTokka(f,W,Sg);break;
    case'HIKI':await pHiki(f,W,Sg);break;
  }
  if(M.at&&AT_MODES.includes(M.mode)&&M.yuuriG>=4000){
    sfx.big();await announce({title:'有利区間完走!!',sub:'天下無双',cls:'rainbow',char:['kaito','yuki','ren'],ms:3000});
    await endAT(true);
  }

async function pNormal(f,W,Sg){
  M.hamari++;
  if(M.kkG>0&&--M.kkG===0)M.kk='low';
  M.point+=1+(W?10:0)+(Sg?30:0);
  let res=null,why='通常';const bo=1+(M.setting-1)*.03;
  if(W||Sg){
    const d={CHE_W:.004,SUI_W:.003,CHE_S:.015,SUI_S:.012,CHANCE:.008}[f]*bo;
    if(rnd()<d){res='AT';why='レア役直撃';}
    else{const t={CHE_W:[.04,.12,.30],SUI_W:[.03,.10,.25],CHE_S:[.25,.45,.75],SUI_S:[.20,.40,.70],CHANCE:[.10,.25,.45]}[f][{low:0,high:1,super:2}[M.kk]];if(rnd()<t*bo)res='CZ';}
    if(Sg){if(rnd()<.25){M.kk='super';M.kkG=20+rint(20);}else if(rnd()<.6){if(M.kk!=='super')M.kk='high';M.kkG=Math.max(M.kkG,15+rint(20));}}
    else if(rnd()<.3){if(M.kk==='low')M.kk='high';M.kkG=Math.max(M.kkG,10+rint(15));}
    lcdMsg(Sg?'霊力急上昇!!':'霊力上昇','');
  }
  if(!res&&M.point>=300){
    M.point=0;const pa={A:.03,B:.06,C:.10,H:.30}[M.tmode]+(M.setting-1)*.004,r=rnd();
    if(r<pa){res='AT';why='周期';}else if(r<pa+.22+(M.setting-1)*.01)res='CZ';else if(rnd()<.4)res='NONE';
    else lcdMsg('霊力周期…','反応なし');

  if(!res&&M.hamari>=TENJO[M.tmode]){res='AT';why='天井';}
  if(res){M.mode='ZENCHO';M.zc={g:why==='天井'?4:5+rint(9),result:res,why};lcdMsg('…!?','空気が変わった');}
}

  }

function drawGraph(){
  const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,Hh=cv.height,d=M.graph.concat([diff()]);
  let mx=Math.max(500,...d),mn=Math.min(-500,...d);const pad=(mx-mn)*.08;mx+=pad;mn-=pad;
  const Y=v=>Hh-(v-mn)/(mx-mn)*Hh;x.clearRect(0,0,W,Hh);
  x.strokeStyle='#2a2638';x.lineWidth=1;x.font='20px sans-serif';x.fillStyle='#6a6480';
  const step=Math.pow(10,Math.floor(Math.log10(mx-mn)))/ (mx-mn>5000?1:2);
  for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step){x.beginPath();x.moveTo(0,Y(v));x.lineTo(W,Y(v));x.stroke();x.fillText(v,4,Y(v)-4);}
  x.strokeStyle='#888';x.beginPath();x.moveTo(0,Y(0));x.lineTo(W,Y(0));x.stroke();
  x.strokeStyle='#ff9a3c';x.lineWidth=3;x.beginPath();d.forEach((v,i)=>{const px=d.length<2?0:i/(d.length-1)*W;i?x.lineTo(px,Y(v)):x.moveTo(px,Y(v));});x.stroke();
}

  else if(k==='j'||k==='1')pressStop(0);else if(k==='k'||k==='2')pressStop(1);else if(k==='l'||k==='3')pressStop(2);
  else if(k==='p')doPush();
});
window.addEventListener('resize',()=>{measure();FX.resize();});

buildReels();FX.init();render();requestAnimationFrame(frame);loadImages();
</script>
