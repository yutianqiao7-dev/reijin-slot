<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>L 覚醒スロット REIJIN</title>
<style>
:root{--h:60px;--gold:#ffcc33;--red:#ff2d3d;--panel:#14121c;--line:#2a2638}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer}
.tbtn{background:#241f33;border:1px solid #3b3452;border-radius:6px;font-size:11px;padding:0 8px}
/* LCD */
#lcdWrap{position:relative;border-radius:10px;padding:5px;background:linear-gradient(135deg,#6b4b12,#e8c15a 30%,#6b4b12 60%,#d8b04a);box-shadow:0 0 18px #ff6a0033}
#lcd{position:relative;aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:#000;transition:box-shadow .2s}
#lcdBg{position:absolute;inset:0;transition:background 1s}
.bg-normal-low #lcdBg{background:linear-gradient(#0b1633,#1b2a52 60%,#27304a)}
.bg-normal-high #lcdBg{background:linear-gradient(#2c1438,#6a2a3c 60%,#8a4a2a)}
.bg-normal-super #lcdBg{background:linear-gradient(#3a0010,#9a1020 55%,#ff5a1a)}
.bg-zencho #lcdBg{background:linear-gradient(#f4f0e6,#c9c1ad 55%,#6d6254)}
.bg-cz #lcdBg{background:radial-gradient(circle at 50% 60%,#39c6ff,#08306a 60%,#020b1c)}
.bg-at #lcdBg{background:radial-gradient(circle at 50% 70%,#ff8a1a,#8a1a00 55%,#1a0400)}
.bg-upper #lcdBg{background:linear-gradient(120deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff,#ff3bd0);background-size:400% 400%;animation:rb 6s linear infinite}
.bg-battle #lcdBg{background:linear-gradient(90deg,#2a0600,#000 50%,#060a2a)}
.bg-bonus #lcdBg{background:radial-gradient(circle,#fff3a0,#ffb400 40%,#6a3a00)}
.bg-tokka #lcdBg{background:radial-gradient(circle at 50% 40%,#ffd1ea,#ff5aa8 45%,#3a0020)}
.bg-hiki #lcdBg{background:linear-gradient(#1a1a1a,#3a3a4a)}
@keyframes rb{0%{background-position:0% 50%}100%{background-position:100% 50%}}
#lcd::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff05 0 2px,transparent 2px 4px),radial-gradient(ellipse at center,transparent 55%,#000a 100%)}
.bg-zencho #lcdMain{color:#16161e}.bg-zencho #lcdTitle,.bg-zencho #lcdSub{text-shadow:0 0 6px #fff,0 0 12px #fff}
#scene,#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scene>div{position:absolute;inset:0;overflow:hidden;animation:scIn .8s ease}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
@keyframes scIn{from{opacity:0;transform:scale(1.06)}}
.rays{position:absolute;left:50%;top:58%;width:230%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(var(--ray) 0 5deg,transparent 5deg 15deg);animation:spin 26s linear infinite;opacity:.3;mix-blend-mode:screen}
.rays.rb{background:repeating-conic-gradient(#ff3b3b 0 5deg,transparent 5deg 12deg,#fffa6b 12deg 17deg,transparent 17deg 24deg,#3bff8a 24deg 29deg,transparent 29deg 36deg,#3bd4ff 36deg 41deg,transparent 41deg 48deg,#c05bff 48deg 53deg,transparent 53deg 60deg);opacity:.4}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sp{transform-box:fill-box;transform-origin:center;animation:spin2 14s linear infinite}
.sp.r{animation-direction:reverse;animation-duration:9s}
@keyframes spin2{to{transform:rotate(360deg)}}
.flick{animation:flick .25s steps(2) infinite alternate}
@keyframes flick{to{opacity:.75;transform:translateY(1px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
.ch{position:absolute;bottom:0;height:92%;width:48%;display:flex;align-items:flex-end;justify-content:center;transition:transform .4s,opacity .4s}
#chL{left:0}#chR{right:0}
.ch img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 0 8px #0008)}
.ph{height:88%;aspect-ratio:3/4;border-radius:10px 10px 0 0;background:linear-gradient(160deg,var(--c),var(--d));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #ffffff55;position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;width:46%;aspect-ratio:1;border-radius:50%;top:12%;background:#0005}
.ph::after{content:"";position:absolute;width:80%;height:45%;bottom:-6%;border-radius:50% 50% 0 0;background:#0005}
.ph span{position:relative;z-index:1;font-weight:900;font-size:clamp(12px,4vw,20px);text-shadow:0 2px 4px #000;writing-mode:vertical-rl;margin-top:14%}
.ph small{position:relative;z-index:1;font-size:8px;opacity:.8;margin-top:auto;margin-bottom:6px}
#lcdTop{position:absolute;left:0;right:0;top:0;padding:4px 8px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;gap:6px;background:linear-gradient(#000a,transparent);z-index:3;text-shadow:0 1px 2px #000}
#lcdTop .ttl{font-size:13px;letter-spacing:1px}
#lcdMain{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:3;pointer-events:none}
#lcdTitle{font-size:clamp(18px,6vw,28px);font-weight:900;text-shadow:0 0 10px #000,0 2px 2px #000;letter-spacing:2px}
#lcdSub{font-size:12px;font-weight:700;text-shadow:0 1px 3px #000;margin-top:2px}
#gauge{position:absolute;left:10%;right:10%;bottom:8%;height:10px;border:2px solid #fff;border-radius:6px;background:#0008;display:none;z-index:3}
#gauge i{display:block;height:100%;width:0;background:linear-gradient(90deg,#39c6ff,#fff);border-radius:3px;transition:width .5s}
#hp{position:absolute;left:4%;right:4%;top:30px;display:none;gap:8%;z-index:3}
#hp>div{flex:1;height:8px;background:#0009;border:1px solid #fff;border-radius:4px;overflow:hidden}
#hp i{display:block;height:100%;width:100%;transition:width .6s}
#hp .hpa i{background:linear-gradient(90deg,#ffb31a,#ff6a00)}
#hp .hpe i{background:linear-gradient(90deg,#ff2d55,#8a0020);margin-left:auto}
#cut{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;align-items:center;overflow:hidden}
#cut.show{display:flex;animation:cutin 1.3s ease both}
#cut .cc{height:100%;width:45%;display:flex;align-items:flex-end;justify-content:center}
#cut .cc img{max-height:100%;max-width:100%}
#cut .ct{flex:1;font-size:clamp(16px,5vw,24px);font-weight:900;text-shadow:0 0 8px #000,0 2px 0 #000;padding-right:8px}
#cut.lv1{background:linear-gradient(100deg,transparent 5%,#1a6bffcc 30%,#1a6bffcc 70%,transparent 95%)}
#cut.lv2{background:linear-gradient(100deg,transparent 5%,#19c25acc 30%,#19c25acc 70%,transparent 95%)}
#cut.lv3{background:linear-gradient(100deg,transparent 5%,#ff1a2ecc 30%,#ff1a2ecc 70%,transparent 95%)}
#cut.lv4{background:linear-gradient(100deg,transparent 5%,#ffc400ee 30%,#ffc400ee 70%,transparent 95%)}
#cut.lv4 .ct{color:#3a1a00;text-shadow:0 0 6px #fff}
#cut.lv5{background:linear-gradient(100deg,#ff3b3b,#ffb33b,#fffa6b,#3bff8a,#3bd4ff,#8a5bff,#ff3bd0)}
@keyframes cutin{0%{transform:translateX(100%)}15%{transform:translateX(0)}85%{transform:translateX(0);opacity:1}100%{transform:translateX(-30%);opacity:0}}
#ov{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000c}
#ov.show{display:flex;animation:pop .35s ease}
#ov .ovc{height:62%;display:flex;gap:4px;align-items:flex-end;justify-content:center}
#ov .ovc>*{height:100%}
#ov .ovc img{height:100%;object-fit:contain}
#ov .ovt{font-size:clamp(22px,8vw,40px);font-weight:900;letter-spacing:2px;text-shadow:0 0 12px currentColor,0 2px 0 #000}
#ov .ovs{font-size:14px;font-weight:700;margin-top:4px}
#ov.gold{background:radial-gradient(circle,#ffe27acc,#6a3a00ee)}#ov.gold .ovt{color:#fff6c8}
#ov.red{background:radial-gradient(circle,#ff3b3bcc,#2a0000ee)}
#ov.blue{background:radial-gradient(circle,#39c6ffcc,#001a3aee)}
#ov.pink{background:radial-gradient(circle,#ff9ad0cc,#3a0020ee)}
#ov.dark{background:#000d}#ov.dark .ovt{color:#888}
#ov.rainbow{background:linear-gradient(120deg,#ff3b3bdd,#ffb33bdd,#fffa6bdd,#3bff8add,#3bd4ffdd,#8a5bffdd,#ff3bd0dd);background-size:400% 400%;animation:pop .35s ease,rb 2s linear infinite}
#ov.rainbow .ovt{color:#fff;text-shadow:0 0 6px #000,0 2px 0 #000}
#ov.ending{background:linear-gradient(#000,#1a0f2a)}
#ov.pre .ovt{animation:blink .5s steps(2) infinite;color:#ffec3b}
@keyframes pop{from{transform:scale(1.15);opacity:0}}
@keyframes blink{50%{opacity:.25}}
#lcd.fx1{box-shadow:inset 0 0 0 4px #1a6bff}#lcd.fx2{box-shadow:inset 0 0 0 4px #19c25a}#lcd.fx3{box-shadow:inset 0 0 0 4px #ff1a2e}#lcd.fx4{box-shadow:inset 0 0 0 4px #ffc400}#lcd.fx5{box-shadow:inset 0 0 0 4px #fff}
#lcd.freeze{filter:brightness(0)}
body.freezeBody .reel{filter:brightness(.2)}
/* lamps */
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 4px) 6px calc(env(safe-area-inset-bottom) + 6px);background:radial-gradient(120% 60% at 50% 0%,#241017 0%,#0b0710 45%,#05050a 100%)}
/* ===== 筐体 ===== */
#cab{position:relative;display:flex;flex-direction:column;gap:5px;padding:6px;border-radius:14px;
  background:linear-gradient(180deg,#3a3a46,#191921 12%,#101018 70%,#26262f);
  box-shadow:0 0 0 2px #0a0a10,0 0 0 3px #4a4a58,0 10px 30px #000a,inset 0 1px 0 #ffffff22;transition:box-shadow .3s}
#cab.lamp1{box-shadow:0 0 0 2px #0a0a10,0 0 0 3px #1a6bff,0 0 26px #1a6bff88,0 10px 30px #000a}
#cab.lamp2{box-shadow:0 0 0 2px #0a0a10,0 0 0 3px #19c25a,0 0 26px #19c25a88,0 10px 30px #000a}
#cab.lamp3{box-shadow:0 0 0 2px #0a0a10,0 0 0 3px #ff1a2e,0 0 30px #ff1a2e99,0 10px 30px #000a}
#cab.lamp4{box-shadow:0 0 0 2px #0a0a10,0 0 0 3px #ffc400,0 0 34px #ffc400aa,0 10px 30px #000a}
#cab.lamp5{animation:cabRb .8s linear infinite}
@keyframes cabRb{0%{box-shadow:0 0 0 3px #ff3b3b,0 0 34px #ff3b3b}25%{box-shadow:0 0 0 3px #fffa6b,0 0 34px #fffa6b}50%{box-shadow:0 0 0 3px #3bff8a,0 0 34px #3bff8a}75%{box-shadow:0 0 0 3px #3bd4ff,0 0 34px #3bd4ff}100%{box-shadow:0 0 0 3px #ff3bd0,0 0 34px #ff3bd0}}
/* データカウンター(台の上のユニット) */
#dataUnit{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:3px;background:#07070c;border:1px solid #2a2638;border-radius:6px;padding:3px}
.du{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.du i{font-style:normal;font-size:8px;color:#7d7796;letter-spacing:.5px}
.du b{font-family:Consolas,monospace;font-size:14px;color:#ff5a2a;text-shadow:0 0 6px #ff5a2a99}
.du b.neg{color:#4aa3ff;text-shadow:0 0 6px #4aa3ff99}
.tbtn{background:linear-gradient(#3a3450,#1d1a28);border:1px solid #5b5478;border-radius:5px;font-size:10px;padding:0 8px;line-height:1.2}
/* タイトルパネル */
#topPanel{position:relative;height:38px;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#1a0a12,#3a0e18 60%,#12060c);box-shadow:inset 0 0 0 1px #6a5a3a,inset 0 0 22px #000}
#topPanel .ttlArt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:6px;font-size:18px;
  background:linear-gradient(#fff,#ffd9a0 45%,#b46a2a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 6px #000}
#topPanel .ttlArt small{font-size:11px;letter-spacing:3px}
#topPanel .tl{position:absolute;top:4px;bottom:4px;width:10px;border-radius:5px;background:#2a2028;box-shadow:inset 0 0 6px #000}
#topPanel .tl.l{left:5px}#topPanel .tl.r{right:5px}
#cab.lamp1 .tl{background:#1a6bff;box-shadow:0 0 12px #1a6bff}
#cab.lamp2 .tl{background:#19c25a;box-shadow:0 0 12px #19c25a}
#cab.lamp3 .tl{background:#ff1a2e;box-shadow:0 0 14px #ff1a2e}
#cab.lamp4 .tl{background:#ffc400;box-shadow:0 0 16px #ffc400}
#cab.lamp5 .tl{background:linear-gradient(#ff3b3b,#fffa6b,#3bff8a,#3bd4ff,#ff3bd0);box-shadow:0 0 16px #fff}
/* ===== リールユニット ===== */
#reelUnit{border-radius:10px;padding:6px;background:linear-gradient(180deg,#6d6d7a,#2b2b35 18%,#1a1a22 82%,#4a4a57);box-shadow:inset 0 1px 0 #ffffff33,0 2px 6px #000a}
#navbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:24px;margin-bottom:5px}
#navbar div{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;border-radius:4px;background:#08080c;box-shadow:inset 0 0 6px #000;color:#23232c;border:1px solid #33333f}
#navbar div.on{color:#fff;background:#c2007a;border-color:#ff7ac8;box-shadow:0 0 12px #ff5ab8,inset 0 0 8px #ff9ad8;animation:blink .55s steps(2) infinite}
#navbar div.aim{color:#ff2d3d;background:#fff;border-color:#ff2d3d;font-size:12px;box-shadow:0 0 12px #ff2d3d}
#reelWin{position:relative;padding:4px;background:#000;border-radius:6px;box-shadow:inset 0 0 0 2px #15151c,inset 0 0 18px #000}
#reels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.reel{position:relative;height:calc(var(--h)*3);overflow:hidden;background:linear-gradient(90deg,#9c968a,#fffdf6 22%,#fffdf6 78%,#9c968a)}
.reel .curve{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,#000e 0%,#000a 6%,#00000042 18%,#ffffff1f 48%,#ffffff10 56%,#00000042 82%,#000a 94%,#000e 100%),
  linear-gradient(90deg,#00000040,#0000 12%,#0000 88%,#00000040)}
.reel .bl{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0;transition:opacity .12s}
.reel .bl.off{opacity:.86;transition:opacity .05s}
.reel.flash .bl{animation:blW .14s steps(2) 6}
.reel.flash2 .bl{animation:blG .16s steps(2) 6}
.reel.flash3 .bl{animation:blR .5s linear 2}
@keyframes blW{50%{opacity:.5;background:#fff}}
@keyframes blG{50%{opacity:.55;background:#ffcc33}}
@keyframes blR{0%{opacity:.5;background:#ff3b3b}25%{opacity:.5;background:#fffa6b}50%{opacity:.5;background:#3bff8a}75%{opacity:.5;background:#3bd4ff}100%{opacity:.5;background:#ff3bd0}}
.strip{will-change:transform,filter}
.reel.bnc{animation:bncR .17s ease-out}
@keyframes bncR{35%{transform:translateY(4px)}70%{transform:translateY(-1px)}100%{transform:translateY(0)}}
.cell{height:var(--h);display:flex;align-items:center;justify-content:center;border-bottom:1px solid #00000014}
.cell svg{height:84%;width:84%}
#glass{position:absolute;inset:4px;pointer-events:none;border-radius:4px;
  background:linear-gradient(112deg,#ffffff1c 0 14%,#ffffff08 16% 22%,transparent 26% 62%,#ffffff12 66% 72%,transparent 76%);
  box-shadow:inset 0 0 0 1px #ffffff1a,inset 0 0 26px #0006}
#cline{position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,#ff2d3d00,#ff2d3d55 20%,#ff2d3d55 80%,#ff2d3d00);pointer-events:none;transition:all .2s}
#cline.win{background:linear-gradient(90deg,#fffa6b00,#fffa6b,#fffa6b00);box-shadow:0 0 12px #fffa6b;animation:blink .18s steps(2) 8}
.lineMark{position:absolute;top:50%;width:0;height:0;margin-top:-7px;border:7px solid transparent;z-index:2;transition:all .2s}
.lineMark.l{left:-2px;border-left-color:#ff2d3d}
.lineMark.r{right:-2px;border-right-color:#ff2d3d}
.lineMark.on{filter:drop-shadow(0 0 6px #fffa6b);animation:blink .18s steps(2) 8}
.lineMark.on.l{border-left-color:#fffa6b}
.lineMark.on.r{border-right-color:#fffa6b}
#infoBar{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 0;font-size:9px;color:#7d7796}
#logo{font-weight:900;font-size:13px;letter-spacing:3px;background:linear-gradient(#fff,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
/* ===== 操作パネル ===== */
#panel{border-radius:10px;padding:6px;background:linear-gradient(180deg,#43434f,#22222b 30%,#15151c 75%,#33333e);box-shadow:inset 0 1px 0 #ffffff2a,0 2px 6px #000a}
#segs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.segBox{display:flex;align-items:center;gap:6px;background:#07070a;border-radius:5px;padding:3px 6px;box-shadow:inset 0 0 8px #000}
.segBox>span{font-size:8px;color:#8a84a0;letter-spacing:1px}
.seg{display:flex;gap:3px;margin-left:auto}
.seg svg{height:20px;width:13px}
.seg .sg{fill:#ff2d1a;filter:drop-shadow(0 0 3px #ff2d1a)}
.seg .sg.o{fill:#2a0a06;filter:none}
#btnRow{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:end}
#leverWrap{position:relative;height:74px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 50% 100%,#2a2a34,#15151c 70%);border-radius:8px;box-shadow:inset 0 0 10px #000}
#lever{position:relative;width:100%;height:100%;border:none;background:none;padding:0;transform-origin:50% 92%;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
#lever.pull{transform:rotate(16deg) translateY(4px)}
#lever i{position:absolute;left:50%;bottom:10%;width:7px;height:52%;margin-left:-3.5px;border-radius:4px;background:linear-gradient(90deg,#6a6a78,#e8e8f0 45%,#5a5a68)}
#lever b{position:absolute;left:50%;top:6%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fff,#ff3b3b 42%,#7a0010);box-shadow:0 0 12px #ff3b3b88,inset 0 -3px 6px #00000055}
#lever:after{content:"";position:absolute;left:50%;bottom:4%;width:26px;height:10px;margin-left:-13px;border-radius:6px;background:linear-gradient(#4a4a58,#1a1a22)}
#stops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stop{position:relative;height:70px;border-radius:50%;border:3px solid #2a2a34;background:radial-gradient(circle at 50% 32%,#3a3a46,#1a1a22 70%);font-weight:900;font-size:11px;color:#4a4a58;
  box-shadow:0 4px 0 #0e0e14,inset 0 2px 6px #ffffff18;transition:all .08s}
.stop.on{border-color:#ffd9a0;color:#fff2d0;background:radial-gradient(circle at 50% 32%,#ffe9c0,#ff7a1a 55%,#8a2a00);box-shadow:0 4px 0 #3a1200,0 0 16px #ff8a3aaa,inset 0 2px 8px #ffffff55}
.stop:active,.stop.press{transform:translateY(3px);box-shadow:0 1px 0 #0e0e14,inset 0 2px 10px #00000088}
#subRow{display:grid;grid-template-columns:1fr 1fr 92px 1fr 1fr;gap:5px;align-items:center;margin-top:7px}
.sbtn{height:34px;border-radius:6px;border:1px solid #4a4458;background:linear-gradient(#2c2838,#191622);font-size:11px;font-weight:700;color:#cfc8e6}
.sbtn.act{background:linear-gradient(#ffb36b,#ff6a00);border-color:#ffd9a0;color:#2a1000}
#push{height:46px;border-radius:23px;border:3px solid #3a3a46;background:radial-gradient(circle at 50% 28%,#4a4a58,#1a1a22 70%);font-weight:900;letter-spacing:1px;color:#8a84a0;box-shadow:0 3px 0 #0e0e14}
/* 下パネル */
#botPanel{position:relative;height:66px;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#1a0a12,#2a0e18 55%,#0e0610);box-shadow:inset 0 0 0 1px #6a5a3a,inset 0 0 26px #000;transition:filter .4s}
#botPanel .bpArt{position:absolute;inset:0;background-size:cover;background-position:center 22%;opacity:.55;filter:saturate(1.1)}
#botPanel .bpLogo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:8px;
  background:linear-gradient(#fff,#ffcf8a 50%,#a85a20);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 8px #000}
#botPanel{border:1px solid #3a2a1a}
#cab.lit #botPanel{filter:brightness(1.9) saturate(1.3);border-color:#ffb36b;box-shadow:inset 0 0 0 1px #ffd9a0,inset 0 0 30px #ff6a0055,0 0 18px #ff6a0066}

<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const rnd=Math.random;
const rint=n=>Math.floor(rnd()*n);
const pick=a=>a[rint(a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=rnd()*t;for(const k in o){r-=o[k];if(r<0)return k;}return Object.keys(o)[0];}
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',ms);}

/* ================= characters ================= */
const CHARS={
  kaito:{name:'焔堂カイト',short:'カイト',c:'#ff7a1a',d:'#3a1600'},
  yuki:{name:'氷室ユキ',short:'ユキ',c:'#8fd3ff',d:'#0b2a44'},
  ren:{name:'赤城レン',short:'レン',c:'#ff3b3b',d:'#3b0000'},
  shion:{name:'桜庭シオン',short:'シオン',c:'#ff9ecf',d:'#3a0f28'},
  toya:{name:'白峰トウヤ',short:'トウヤ',c:'#bff4ff',d:'#06303a'},
  gou:{name:'鬼塚ゴウ',short:'ゴウ',c:'#ffd23a',d:'#2b2200'},

  get(k,st='img'){return this.tx(st,'readonly',s=>s.get(k));},put(k,v,st='img'){return this.tx(st,'readwrite',s=>s.put(v,k));},del(k,st='img'){return this.tx(st,'readwrite',s=>s.delete(k));}

const sym=(r,i)=>STRIPS[r][((i%N)+N)%N];
function classify(c){
  const w=r=>[sym(r,c[r]-1),sym(r,c[r]),sym(r,c[r]+1)];
  const a=w(0),b=w(1),d=w(2),m0=a[1],m1=b[1],m2=d[1],res=[];
  if(m0==='7'&&m1==='7'&&m2==='7')res.push('BB');else if(m0==='7'&&m1==='7'&&m2==='B')res.push('PREM');
  if(m0==='r'&&m1==='r'&&m2==='r')res.push('REP');
  if(m0==='b'&&m1==='b'&&m2==='b')res.push('BELL');
  if(m0==='s'&&m1==='s'&&m2==='s')res.push('SUI_S');
  else if((a[2]==='s'&&m1==='s'&&d[0]==='s')||(a[0]==='s'&&m1==='s'&&d[2]==='s'))res.push('SUI_W');
  if(m0==='r'&&m1==='b'&&m2==='r')res.push('CHANCE');
  if(m0==='c')res.push('CHE_S');else if(a[0]==='c'||a[2]==='c')res.push('CHE_W');
  return res.length?res.join('+'):'NONE';
}
const FLAG_TARGET={HAZURE:'NONE',REP:'REP',CHE_W:'CHE_W',CHE_S:'CHE_S',SUI_W:'SUI_W',SUI_S:'SUI_S',CHANCE:'CHANCE',FREEZE:'PREM',BB:'BB'};
const maxSlide=t=>(S.assist&&t!=='NONE')?20:4;
function reachScore(c,rem,t){
  const ms=maxSlide(t);
  if(rem.length===1){
    const r=rem[0],ach=[];
    for(let i=0;i<N;i++){c[r]=i;ach[i]=classify(c)===t;}
    let ok=0;for(let p=0;p<N;p++)for(let k=0;k<=ms;k++)if(ach[(p-k+N)%N]){ok++;break;}
    return ok/N;
  }
  const[r1,r2]=rem,ach=new Array(N*N);
  for(let i=0;i<N;i++){c[r1]=i;for(let j=0;j<N;j++){c[r2]=j;ach[i*N+j]=classify(c)===t;}}
  let ok=0;
  for(let p1=0;p1<N;p1++)for(let p2=0;p2<N;p2++){
    let f=false;
    for(let k1=0;k1<=ms&&!f;k1++){const i=(p1-k1+N)%N;for(let k2=0;k2<=ms;k2++)if(ach[i*N+(p2-k2+N)%N]){f=true;break;}}
    if(f)ok++;
  }
  return ok/(N*N);
}
function chooseStop(ri,press,centers,t){
  const rem=[0,1,2].filter(r=>r!==ri&&centers[r]==null);
  const evalT=tt=>{let best=null,bs=-1;
    for(let k=0;k<=maxSlide(tt);k++){
      const idx=(press-k+N*2)%N,c=centers.slice();c[ri]=idx;
      let sc;
      if(!rem.length){const key=classify(c);sc=key===tt?2:(key==='NONE'?1:0);}
      else sc=reachScore(c,rem,tt);
      if(sc>bs+1e-9){bs=sc;best=idx;}
    }return[best,bs];};
  let[best,bs]=evalT(t);
  if(bs<=0&&t!=='NONE')[best]=evalT('NONE');
  return best;
}

/* ================= reel view ================= */
const R=[];let H=60;
function buildReels(){
  const wrap=$('#reels');
  for(let r=0;r<3;r++){
    const reel=document.createElement('div');reel.className='reel';
    const strip=document.createElement('div');strip.className='strip';
    for(let k=0;k<24;k++){const cell=document.createElement('div');cell.className='cell';cell.innerHTML=SVG[sym(r,k-1)];strip.appendChild(cell);}
    reel.appendChild(strip);
    const bl=document.createElement('div');bl.className='bl';reel.appendChild(bl);
    const cv=document.createElement('div');cv.className='curve';reel.appendChild(cv);
    wrap.appendChild(reel);
    R.push({el:reel,strip,bl,pos:rint(N),state:'stop',target:0,vel:0,blur:0});
  }
  measure();
}
function measure(){
  const avail=window.innerHeight;const h=Math.max(34,Math.min(64,Math.floor((avail-648)/3)));
  document.documentElement.style.setProperty('--h',h+'px');H=h;
}
function bounce(rl){rl.el.classList.remove('bnc');void rl.el.offsetWidth;rl.el.classList.add('bnc');setTimeout(()=>rl.el.classList.remove('bnc'),220);}
const SPEED=26,ACC=110;let lastT=0;
function frame(t){
  const dt=Math.min(.05,(t-lastT)/1000||0);lastT=t;
  for(const rl of R){
    if(rl.state==='spin'){rl.vel=Math.min(SPEED,rl.vel+ACC*dt);rl.pos-=rl.vel*dt;if(rl.pos<0)rl.pos+=N;}
    else if(rl.state==='rev'){rl.vel=SPEED*.5;rl.pos+=rl.vel*dt;if(rl.pos>=N)rl.pos-=N;}
    else if(rl.state==='stopping'){
      const remain=((rl.pos-rl.target)%N+N)%N,step=rl.vel*dt;
      if(remain<=step){rl.pos=rl.target;rl.state='stop';rl.vel=0;bounce(rl);onReelStopped();}
      else{rl.pos-=step;if(rl.pos<0)rl.pos+=N;}
    }else rl.vel=0;
    /* 回転中は実機のようにブレて見える */
    const b=Math.min(7,rl.vel*.28);
    if(Math.abs(rl.blur-b)>.4){rl.blur=b;rl.strip.style.filter=b>.5?`blur(${b.toFixed(1)}px)`:'none';}
    rl.strip.style.transform=`translateY(${-rl.pos*H}px)`;
  }
  segStep(dt);
  FX.step(dt);
  requestAnimationFrame(frame);
}

const SEG_PATH={a:'12,4 38,4 32,11 18,11',b:'39,7 37,33 31,30 33,12',c:'36,39 34,65 28,60 30,42',

const SEG_ON={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcfgd','-':'g',' ':''};
function setSeg(el,val,len){
  const str=String(val).padStart(len,' ').slice(-len);
  if(el.dataset.v===str)return;el.dataset.v=str;
  el.innerHTML=[...str].map(ch=>{const on=SEG_ON[ch]||'';
    return`<svg viewBox="0 0 48 72">${'abcdefg'.split('').map(k=>`<polygon class="sg${on.includes(k)?'':' o'}" points="${SEG_PATH[k]}"/>`).join('')}</svg>`;}).join('');
}
let dispCredit=0,payDisp=0,payT=0;
function updSegs(){setSeg($('#segCredit'),Math.max(0,dispCredit),3);setSeg($('#segPay'),payDisp,2);}
/* 払い出しは実機のように1枚ずつ増える */
function segStep(dt){
  if(dispCredit===M.credits)return;
  payT-=dt;if(payT>0)return;
  const d=Math.sign(M.credits-dispCredit);
  dispCredit+=d;if(d>0){payDisp++;sfx.coin();}
  payT=d>0?.05:.035;updSegs();
}

    else o+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(h+2).toFixed(1)}" fill="${col}"/>`;

  set(m){if(m===this.mode)return;this.mode=m;this.ps=[];this.shoot=null;this.bolt=null;this.flash=0;for(let i=0;i<(this.N[m]||0);i++)this.ps.push(this.spawn(true));},
  spawn(init){
    const w=this.w,h=this.h,m=this.mode,p={x:rnd()*w,y:rnd()*h,s:1,ph:rnd()*6.28,rot:rnd()*6.28,vr:0,vx:0,vy:0,hue:rnd()*360};
    switch(m){
      case'bg-normal-low':p.y=rnd()*h*.55;p.s=.4+rnd()*1.1;break;
      case'bg-normal-high':case'bg-normal-super':if(!init)p.y=h+5;p.vy=-(8+rnd()*(m==='bg-normal-super'?45:18));p.vx=(rnd()-.5)*6;p.s=.7+rnd()*1.5;break;
      case'bg-zencho':if(!init)p.y=-5;p.vy=6+rnd()*10;p.vx=4+rnd()*6;p.s=1+rnd()*1.6;p.vr=(rnd()-.5)*3;break;
      case'bg-cz':p.r=init?rnd()*w*.6:w*.5+rnd()*w*.15;p.ang=rnd()*6.28;p.s=.8+rnd()*1.4;break;
      case'bg-at':case'bg-upper':if(!init)p.y=h+5;p.vy=-(40+rnd()*90);p.vx=(rnd()-.5)*20;p.s=.8+rnd()*1.6;break;
      case'bg-battle':{const d=rnd()<.5?1:-1;if(!init)p.x=d>0?-60:w+60;p.vx=d*(260+rnd()*320);p.len=20+rnd()*50;break;}
      case'bg-bonus':if(!init)p.y=h+5;p.vy=-(10+rnd()*25);p.s=1+rnd()*2.2;break;
      case'bg-tokka':if(!init)p.y=-8;p.vy=12+rnd()*18;p.vx=8+rnd()*14;p.s=2+rnd()*2.4;p.vr=(rnd()-.5)*4;break;
      case'bg-hiki':if(!init)p.y=-10;p.vy=240+rnd()*120;p.vx=-45;p.len=6+rnd()*8;break;
    }
    return p;
  },
  step(dt){
    if(!this.c||!this.mode)return;
    const c=this.c,w=this.w,h=this.h,m=this.mode,t=(this.t+=dt);
    c.clearRect(0,0,w,h);
    c.globalCompositeOperation=(m==='bg-zencho'||m==='bg-hiki'||m==='bg-tokka')?'source-over':'lighter';
    for(let i=0;i<this.ps.length;i++){
      const p=this.ps[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;let out=false;
      switch(m){
        case'bg-normal-low':{const a=.35+.65*Math.abs(Math.sin(t*1.6+p.ph));c.fillStyle=`rgba(255,255,230,${a})`;c.beginPath();c.arc(p.x,p.y,p.s,0,6.28);c.fill();break;}
        case'bg-normal-high':case'bg-normal-super':{p.x+=Math.sin(t*2+p.ph)*.3;const col=m==='bg-normal-super'?'255,60,50':'255,170,70';
          c.fillStyle=`rgba(${col},.18)`;c.beginPath();c.arc(p.x,p.y,p.s*3.2,0,6.28);c.fill();c.fillStyle=`rgba(${col},.9)`;c.beginPath();c.arc(p.x,p.y,p.s,0,6.28);c.fill();out=p.y<-8;break;}
        case'bg-zencho':c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='rgba(120,112,100,.45)';c.fillRect(-p.s,-p.s/2,p.s*2,p.s);c.restore();out=p.y>h+6||p.x>w+6;break;
        case'bg-cz':{p.ang+=dt*(1.2+40/(p.r+12));p.r-=dt*(14+w*.06);const x=w/2+Math.cos(p.ang)*p.r,y=h*.56+Math.sin(p.ang)*p.r*.55,a=Math.min(1,p.r/(w*.3));
          c.fillStyle=`rgba(140,240,255,${.25+.75*(1-a)})`;c.beginPath();c.arc(x,y,p.s,0,6.28);c.fill();out=p.r<3;break;}
        case'bg-at':case'bg-upper':{const col=m==='bg-upper'?`hsla(${(p.hue+t*140)%360},100%,65%,.95)`:`hsla(${28+p.ph*4},100%,${55+p.s*8}%,.95)`;
          c.strokeStyle=col;c.lineWidth=p.s;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*.05,p.y-p.vy*.05);c.stroke();out=p.y<-12;break;}
        case'bg-battle':c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-Math.sign(p.vx)*p.len,p.y);c.stroke();out=p.x<-80||p.x>w+80;break;
        case'bg-bonus':{const a=.3+.7*Math.abs(Math.sin(t*3+p.ph)),r=p.s*2.2;c.save();c.translate(p.x,p.y);c.rotate(t+p.ph);c.fillStyle=`rgba(255,230,120,${a})`;
          c.fillRect(-r,-.5,r*2,1);c.fillRect(-.5,-r,1,r*2);c.beginPath();c.arc(0,0,p.s*.7,0,6.28);c.fill();c.restore();out=p.y<-8;break;}
        case'bg-tokka':p.x+=Math.sin(t*1.8+p.ph)*.5;c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle='rgba(255,183,213,.92)';c.beginPath();c.ellipse(0,0,p.s*1.5,p.s*.8,0,0,6.28);c.fill();
          c.fillStyle='rgba(255,120,170,.6)';c.beginPath();c.ellipse(p.s*.6,0,p.s*.5,p.s*.3,0,0,6.28);c.fill();c.restore();out=p.y>h+10||p.x>w+10;break;
        case'bg-hiki':c.strokeStyle='rgba(170,190,225,.35)';c.lineWidth=1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+p.vx*.03,p.y+p.len);c.stroke();out=p.y>h+10;break;
      }
      if(out)this.ps[i]=this.spawn(false);
    }
    /* 単発イベント: 流れ星・落雷 */
    if((this.nextEv-=dt)<=0){
      this.nextEv=3+rnd()*5;
      if(m==='bg-normal-low')this.shoot={x:w*(.5+rnd()*.5),y:rnd()*h*.25,life:0};
      if(m==='bg-normal-super'||m==='bg-battle'){this.flash=1;const pts=[[w*(.2+rnd()*.6),0]];while(pts[pts.length-1][1]<h*.8)pts.push([pts[pts.length-1][0]+(rnd()-.5)*30,pts[pts.length-1][1]+10+rnd()*18]);this.bolt=pts;}
    }
    if(this.shoot){const s=this.shoot;s.life+=dt;const x=s.x-s.life*180,y=s.y+s.life*70,g=c.createLinearGradient(x,y,x+40,y-16);
      g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');c.strokeStyle=g;c.lineWidth=1.4;c.beginPath();c.moveTo(x,y);c.lineTo(x+40,y-16);c.stroke();if(s.life>.8)this.shoot=null;}
    if(this.flash>0){
      if(this.bolt&&this.flash>.6){c.strokeStyle=`rgba(255,240,255,${this.flash})`;c.lineWidth=1.8;c.beginPath();this.bolt.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();}
      c.globalCompositeOperation='source-over';c.fillStyle=`rgba(255,255,255,${this.flash*.35})`;c.fillRect(0,0,w,h);this.flash=Math.max(0,this.flash-dt*2.5);
    }
  }
};

/* ================= game flow ================= */
let G=null,busy=false,auto=false,lastLever=0;
function rollFlag(){
  const s=M.setting;
  const t=flagTable(s);
  let r=rnd();for(const k in t){r-=t[k];if(r<0)return k;}return'HAZURE';
}
const isW=f=>f==='CHE_W'||f==='SUI_W';
const isS=f=>f==='CHE_S'||f==='SUI_S'||f==='CHANCE';
function preGame(){
  const p={flag:rollFlag(),order:null,nav:false,aim7:false};
  if(M.mode==='AT'&&M.at&&M.at.pendingBB&&['HAZURE','BELL','REP'].includes(p.flag))p.flag='BB';
  if(p.flag==='BELL'){p.order=pick(ORDERS);if(AT_MODES.includes(M.mode))p.nav=true;}
  if(p.flag==='BB')p.aim7=true;
  return p;
}
function curTarget(g){
  if(g.flag==='BELL'){for(let i=0;i<g.stopOrder.length;i++)if(g.stopOrder[i]!==g.order[i])return'NONE';return'BELL';}
  return FLAG_TARGET[g.flag];
}
async function lever(){
  if(busy||G)return;
  ac();
  if(!M.replay){
    if(M.credits<3){toast('メダルが足りません → 右上の「貸出」');stopAuto();return;}
    M.credits-=3;M.inT+=3;
  }
  busy=true;M.replay=false;
  if(S.wait){const w=4100-(performance.now()-lastLever);if(w>0){$('#lever').textContent='WAIT';await sleep(w);$('#lever').textContent='LEVER';}}
  lastLever=performance.now();
  const p=preGame();
  G=Object.assign(p,{stopOrder:[],centers:[null,null,null],ready:false,stopped:0});
  const done=new Promise(res=>G.resolve=res);
  payDisp=0;updSegs();
  const lv=$('#lever');lv.classList.add('pull');setTimeout(()=>lv.classList.remove('pull'),260);
  render();sfx.lever();
  showNav(G);BGM.update();await leverFx(G);
  if(p.flag==='FREEZE')await freezeFx();
  R.forEach(r=>r.state='spin');
  await sleep(280);G.ready=true;updStops();
  if(auto)autoStops();
  await done;
  const key=classify(G.centers);
  endFx(G,key);
  const pay=settle(p,key);
  const g=G;G=null;clearNav();updStops();
  await postGame(g,key,pay);
  if(M.games%M.gstep===0){M.graph.push(diff());if(M.graph.length>6000){M.graph=M.graph.filter((_,i)=>i%2===0);M.gstep*=2;}}
  M.maxDiff=Math.max(M.maxDiff,diff());
  save();render();busy=false;
  if(auto)setTimeout(()=>{if(auto)lever();},220);
}
function pressStop(r){
  if(!G||!G.ready)return;const rl=R[r];if(rl.state!=='spin')return;
  const press=((Math.floor(rl.pos))%N+N)%N;
  G.stopOrder.push(r);
  const idx=chooseStop(r,press,G.centers,curTarget(G));
  G.centers[r]=idx;rl.target=idx;rl.state='stopping';sfx.stop();
  const btn=document.querySelectorAll('.stop')[r];btn.classList.add('press');setTimeout(()=>btn.classList.remove('press'),110);
  stopFx();
  const nd=$('#navbar').children[r];nd.classList.remove('on');
  updStops();
}
function onReelStopped(){if(G){G.stopped++;if(G.stopped===3)G.resolve();}}
function autoStops(){const o=(G.nav&&G.order)?G.order:[0,1,2];o.forEach((r,i)=>setTimeout(()=>pressStop(r),160+i*150));}
function settle(p,key){
  let pay=0,rep=false;
  for(const k of key.split('+')){
    if(k==='BELL')pay+=9;else if(k==='CHE_W'||k==='CHE_S')pay+=2;else if(k==='SUI_W'||k==='SUI_S')pay+=6;
    else if(k==='CHANCE'||k==='PREM')pay+=1;else if(k==='REP')rep=true;
  }
  if(p.flag==='BELL'&&key==='NONE')pay+=1;
  M.credits+=pay;M.outT+=pay;M.replay=rep;
  if(rep){sfx.replay();winLine();}
  else if(pay){if(SND.buf.pay)playBuf('pay');winLine();}
  return pay;
}

/* 期待度: 0=なし 1=青 2=緑 3=赤 4=金 5=虹(確定) */
function calcHeat(g){
  const f=g.flag;let h=0,sure=false;
  if(f==='FREEZE')return{h:5,sure:true};
  if(f==='BB'){h=4;sure=true;}else if(isS(f))h=3;else if(isW(f))h=2;
  switch(M.mode){
    case'NORMAL':if(M.kk==='super'&&h)h++;break;
    case'ZENCHO':if(M.zc.result==='AT'){h+=h?2:1;sure=true;}else if(M.zc.result==='CZ'&&h)h+=1;break;
    case'CZ':if(M.cz.won&&h){h+=1;sure=true;}break;
    case'BATTLE':if(M.battle.win&&h){h+=1;sure=true;}break;
    case'HIKI':if(M.hiki.win&&h){h+=1;sure=true;}break;
  }
  return{h:Math.min(4,h),sure};
}
function fxLevel(g){
  const{h,sure}=calcHeat(g);
  if(g.flag==='FREEZE'||g.flag==='BB')return 5;
  if(h===0)return rnd()<.06?(rnd()<.8?1:2):0;
  if(rnd()>.35+h*.15)return 0;
  let l=Math.max(1,h-(rnd()<.4?1:0));
  if(sure&&h>=3&&rnd()<.1)l=5;
  return l;
}

async function pNormal(f,W,Sg){
  M.hamari++;

  let res=null,why='通常';const bo=1+(M.setting-1)*.03;
  if(W||Sg){
    const d=DIRECT_AT[f]*bo;

function drawGraph(){
  const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d'),W=cv.width,Hh=cv.height,d=M.graph.concat([diff()]);
  let mx=Math.max(500,...d),mn=Math.min(-500,...d);const pad=(mx-mn)*.08;mx+=pad;mn-=pad;
  const Y=v=>Hh-(v-mn)/(mx-mn)*Hh;x.clearRect(0,0,W,Hh);
  x.strokeStyle='#2a2638';x.lineWidth=1;x.font='20px sans-serif';x.fillStyle='#6a6480';
  const step=Math.pow(10,Math.floor(Math.log10(mx-mn)))/ (mx-mn>5000?1:2);
  for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step){x.beginPath();x.moveTo(0,Y(v));x.lineTo(W,Y(v));x.stroke();x.fillText(v,4,Y(v)-4);}
  x.strokeStyle='#888';x.beginPath();x.moveTo(0,Y(0));x.lineTo(W,Y(0));x.stroke();
  x.strokeStyle='#ff9a3c';x.lineWidth=3;x.beginPath();d.forEach((v,i)=>{const px=d.length<2?0:i/(d.length-1)*W;i?x.lineTo(px,Y(v)):x.moveTo(px,Y(v));});x.stroke();
}

const SPEC_SIM={"1":{"at":0.00296,"cz":0.00461,"czWin":0.3601,"rate":98.4,"get":362,"sets":3.62,"over1k":0.06637,"tenjo":0.23375},"2":{"at":0.00308,"cz":0.00469,"czWin":0.37548,"rate":101,"get":378,"sets":3.75,"over1k":0.06813,"tenjo":0.22542},"3":{"at":0.00329,"cz":0.00482,"czWin":0.40913,"rate":103.4,"get":385,"sets":3.8,"over1k":0.07116,"tenjo":0.21602},"4":{"at":0.00349,"cz":0.00487,"czWin":0.42462,"rate":107.2,"get":407,"sets":3.96,"over1k":0.07555,"tenjo":0.21435},"5":{"at":0.00373,"cz":0.00502,"czWin":0.45481,"rate":110.7,"get":424,"sets":4.07,"over1k":0.07901,"tenjo":0.20565},"6":{"at":0.00398,"cz":0.00518,"czWin":0.47322,"rate":115,"get":450,"sets":4.17,"over1k":0.0844,"tenjo":0.20227},"games":2000000,"coin":44.6,"junzou":2.75,"fx":{"1":0.108,"2":0.523,"3":1,"4":1,"5":0}};
const SETS=[1,2,3,4,5,6];
const pct=(v,d=1)=>(v*100).toFixed(d)+'%';
const inv=(p,d=1)=>p>0?'1/'+(1/p).toFixed(d):'-';
const norm=o=>{let t=0;for(const k in o)t+=o[k];const r={};for(const k in o)r[k]=o[k]/t;return r;};
const trow=(head,cells)=>`<tr><th>${head}</th>${cells.map(c=>`<td class="r">${c}</td>`).join('')}</tr>`;
const setHead=(first='')=>`<tr><th>${first}</th>${SETS.map(s=>`<th class="r">設定${s}</th>`).join('')}</tr>`;
const ROLE_NAME={BELL:'押し順ベル',REP:'リプレイ',CHE_W:'弱チェリー',CHE_S:'強チェリー',SUI_W:'弱スイカ',SUI_S:'強スイカ',CHANCE:'チャンス目',FREEZE:'フリーズ',HAZURE:'ハズレ'};
const RARES=['CHE_W','SUI_W','CHE_S','SUI_S','CHANCE'];
const ANA={
  spec(){
    const sim=SPEC_SIM,v=(s,k,f)=>sim?f(sim[s][k]):'-';
    const ft=SETS.map(flagTable);
    const hz=ft.map(t=>1-Object.values(t).reduce((a,b)=>a+b,0));
    return`
    <h3>機種概要</h3>
    <table>
      <tr><th>タイプ</th><td>AT機（スマスロ・メダルレス）</td></tr>
      <tr><th>AT純増</th><td>約${sim?sim.junzou.toFixed(1):'-'}枚/G（押し順ナビ）</td></tr>
      <tr><th>コイン持ち</th><td>約${sim?sim.coin.toFixed(0):'-'}G / 50枚</td></tr>
      <tr><th>天井</th><td>通常時 最大${TENJO.A}G ＋前兆 → AT確定</td></tr>
      <tr><th>有利区間</th><td>最大4000G</td></tr>
      <tr><th>AT性能</th><td>1SET ${15}G ＋決戦バトル（継続率 ${KEIZOKU[0]}〜${KEIZOKU[KEIZOKU.length-1]}%）</td></tr>
      <tr><th>1G当たり</th><td>3枚掛け</td></tr>
    </table>
    <h3>設定別 初当たり・機械割</h3>
    <table>${setHead()}
      ${trow('AT初当たり',SETS.map(s=>v(s,'at',x=>inv(x,0))))}
      ${trow('CZ確率',SETS.map(s=>v(s,'cz',x=>inv(x,0))))}
      ${trow('CZ成功率',SETS.map(s=>v(s,'czWin',x=>pct(x,0))))}
      ${trow('機械割',SETS.map(s=>v(s,'rate',x=>x.toFixed(1)+'%')))}
    </table>
    <h3>設定別 AT性能</h3>
    <table>${setHead()}
      ${trow('平均獲得',SETS.map(s=>v(s,'get',x=>Math.round(x)+'枚')))}
      ${trow('平均SET数',SETS.map(s=>v(s,'sets',x=>x.toFixed(2))))}
      ${trow('1000枚超',SETS.map(s=>v(s,'over1k',x=>pct(x,1))))}
      ${trow('天井到達',SETS.map(s=>v(s,'tenjo',x=>pct(x,1))))}
    </table>
    <h3>小役確率</h3>
    <table>${setHead('小役')}
      ${Object.keys(ft[0]).map(k=>trow(ROLE_NAME[k],ft.map(t=>inv(t[k],k==='BELL'||k==='REP'?2:1)))).join('')}
      ${trow('ハズレ',hz.map(x=>inv(x,2)))}
    </table>
    <p class="note">初当たり・CZ・機械割・AT性能は、各設定${sim?Math.round(sim.games/10000)+'万':'-'}ゲームのシミュレーション値です（押し順ナビどおり・目押しサポートONで消化）。初当たりとCZ確率は通常時のゲーム数で割っています。</p>`;
  },
  flow(){
    const czAvg=SPEC_SIM?pct(SETS.reduce((a,s)=>a+SPEC_SIM[s].czWin,0)/6,0):'約40%';
    return`
    <div class="flow">
      <div class="fn n">通常時<small>低確 / 高確 / 超高確</small></div>
      <div class="fb"><span>レア役 → CZ・AT直撃抽選</span><span>霊力300pt → 周期抽選</span><span>天井 ${TENJO.H}〜${TENJO.A}G</span></div>
      <div class="fa">▼</div>
      <div class="fn z">前兆（冥界ステージ）<small>5〜13G ・ 最後に魔獣バトルで告知</small></div>
      <div class="fsplit">
        <div><div class="fa">▼ CZ当選</div><div class="fn c">霊力解放ZONE<small>10G ・ 成功率 ${czAvg}</small></div><div class="fa">▼ 成功</div></div>
        <div><div class="fa">▼ AT直撃</div></div>
        <div><div class="fa">▼ ガセ・失敗</div><div class="fn g">通常時へ</div></div>
      </div>
      <div class="fn a">REIJIN RUSH<small>1SET 15G ・ 純増 約${SPEC_SIM?SPEC_SIM.junzou.toFixed(1):'3'}枚/G</small></div>
      <div class="fb"><span>レア役 → G数上乗せ</span><span>霊力ストック</span><span>覚醒BONUS 25G</span><span>桜吹雪ラッシュ 10G</span></div>
      <div class="fa">▼ SET消化</div>
      <div class="fn b">決戦バトル 5G<small>継続率 ${KEIZOKU[0]}〜${KEIZOKU[KEIZOKU.length-1]}% ・ ストックがあれば勝利確定</small></div>
      <div class="fsplit two"><div><div class="fa up">勝利 ▲ 次のSETへ</div></div><div><div class="fa">▼ 敗北</div></div></div>
      <div class="fn h">反撃ZONE 5G<small>引き戻し ${pct(hikiRate(1),0)}〜${pct(hikiRate(6),0)}</small></div>
      <div class="fa">▼</div>
      <div class="fn g">通常時へ（モード再抽選）</div>
      <div class="fnote">
        <b>フリーズ</b>（${inv(flagTable(1).FREEZE,0)}）→ 真・覚醒RUSH ＋ 桜吹雪ラッシュ<br>
        <b>真・覚醒RUSH</b>：継続率85%の上位AT。フリーズ、またはBONUS開始時2%で昇格<br>
        <b>有利区間</b>：4000Gに達すると「有利区間完走」で終了
      </div>
    </div>`;
  },
  normal(){
    const tw=SETS.map(s=>norm(tenjoWeights(s)));
    const MN={A:'A',B:'B',C:'C',H:'天国'};
    return`
    <h3>内部状態</h3>
    <table>
      <tr><th>低確</th><td>基本の状態。背景は夜の街</td></tr>
      <tr><th>高確</th><td>弱レア役の30%、強レア役の45%で移行（10〜34G）。背景は夕焼け</td></tr>
      <tr><th>超高確</th><td>強レア役の25%で移行（20〜39G）。背景は赤い月</td></tr>
    </table>
    <h3>レア役別 CZ当選率</h3>
    <table><tr><th>役</th><th class="r">低確</th><th class="r">高確</th><th class="r">超高確</th><th class="r">AT直撃</th></tr>
      ${RARES.map(k=>`<tr><th>${ROLE_NAME[k]}</th>${CZ_RATE[k].map(x=>`<td class="r">${pct(x)}</td>`).join('')}<td class="r">${pct(DIRECT_AT[k])}</td></tr>`).join('')}
    </table>
    <p class="note">設定1の値。設定が1上がるごとに当選率は×1.03（設定6は×1.15）。</p>
    <h3>霊力ポイントと周期抽選</h3>
    <table>
      <tr><th>加算</th><td>毎ゲーム+1 / 弱レア役+10 / 強レア役+30</td></tr>
      <tr><th>周期</th><td>300ptで抽選（ポイントはリセット）</td></tr>
    </table>
    <table><tr><th>モード</th><th class="r">天井</th><th class="r">周期AT当選</th></tr>
      ${Object.keys(TENJO).map(m=>`<tr><th>${MN[m]}</th><td class="r">${TENJO[m]}G</td><td class="r">${pct(PERIOD_AT[m])}</td></tr>`).join('')}
    </table>
    <p class="note">周期で外れた場合、CZ当選${pct(.22,0)}（設定ごとに+1%）、残りの一部はガセ前兆。周期AT当選は設定ごとに+0.4%。</p>
    <h3>モード振り分け（AT終了後）</h3>
    <table>${setHead('モード')}${Object.keys(TENJO).map(m=>trow(MN[m],tw.map(w=>pct(w[m],0)))).join('')}</table>
    <h3>前兆</h3>
    <table>
      <tr><th>期間</th><td>5〜13G（天井は4G）</td></tr>
      <tr><th>昇格</th><td>前兆中のレア役で CZ→AT（強25% / 弱5%）、ガセ→CZ（強50% / 弱15%）</td></tr>
    </table>
    <h3>霊力解放ZONE（CZ）</h3>
    <table><tr><th>役</th><th class="r">1Gあたりの成功抽選</th></tr>
      ${Object.keys(CZ_WIN).map(k=>`<tr><th>${ROLE_NAME[k]}</th><td class="r">${pct(CZ_WIN[k])}</td></tr>`).join('')}
    </table>
    <p class="note">10G継続。設定ごとに+0.4%。強レア役で成功したときは即告知、それ以外は最終ゲームで告知。</p>`;
  },
  at(){
    const kw=SETS.map(s=>norm(keizokuWeights(s)));
    const expSets=w=>KEIZOKU.reduce((a,k)=>a+w[k]/(1-k/100),0);
    const ew=norm(ENEMY_W.win),el=norm(ENEMY_W.lose);
    return`
    <h3>継続率の振り分け</h3>
    <table>${setHead('継続率')}
      ${KEIZOKU.map(k=>trow(k+'%',kw.map(w=>pct(w[k],1)))).join('')}
      ${trow('平均SET数',kw.map(w=>expSets(w).toFixed(2)))}
    </table>
    <p class="note">平均SET数はストック・継続率UP・引き戻しを含まない理論値。勝利時5%で継続率が1段階UP（通常RUSH）。</p>
    <h3>AT中のレア役</h3>
    <table><tr><th>役</th><th>恩恵</th><th class="r">BONUS</th></tr>
      <tr><th>弱チェ・弱スイカ</th><td>35%で5/10/20G上乗せ</td><td class="r">2%</td></tr>
      <tr><th>強チェリー</th><td>15%で桜吹雪ラッシュ、それ以外は10〜50G上乗せ</td><td class="r">15%</td></tr>
      <tr><th>強スイカ</th><td>10〜50G上乗せ</td><td class="r">10%</td></tr>
      <tr><th>チャンス目</th><td>25%でストック、それ以外は5〜20G上乗せ</td><td class="r">8%</td></tr>
      <tr><th>ハズレ</th><td>-</td><td class="r">0.2%</td></tr>
      <tr><th>リプレイ</th><td>1/300で10/20G上乗せ</td><td class="r">-</td></tr>
    </table>
    <h3>覚醒BONUS</h3>
    <table>
      <tr><th>期間</th><td>25G（赤7揃いで開始）</td></tr>
      <tr><th>ストック</th><td>強レア30% / 弱レア8% / ベル0.5%</td></tr>
      <tr><th>上乗せ</th><td>ストックに外れたレア役で10/20/30G</td></tr>
      <tr><th>昇格</th><td>開始時2%で真・覚醒RUSHへ</td></tr>
    </table>
    <h3>桜吹雪ラッシュ（上乗せ特化）</h3>
    <table>
      <tr><th>期間</th><td>10G</td></tr>
      <tr><th>上乗せ</th><td>ベル3〜10G / リプ3〜5G / 弱レア10〜30G / 強レア20〜100G ＋毎ゲーム1/25で+100G</td></tr>
      <tr><th>平均</th><td>約90G</td></tr>
    </table>
    <h3>決戦バトル 敵キャラ別の勝率</h3>
    <table><tr><th>継続率</th>${Object.keys(ew).map(e=>`<th class="r">${CHARS[e].short}</th>`).join('')}</tr>
      ${KEIZOKU.map(k=>{const p=k/100;return`<tr><th>${k}%</th>${Object.keys(ew).map(e=>`<td class="r">${pct(p*ew[e]/(p*ew[e]+(1-p)*el[e]),0)}</td>`).join('')}</tr>`;}).join('')}
    </table>
    <p class="note">ストックがある場合は敵に関係なく勝利確定。敗北予定でもバトル中の強レア役50%、弱レア役15%で逆転。</p>
    <h3>真・覚醒RUSH / 反撃ZONE</h3>
    <table>
      <tr><th>真・覚醒RUSH</th><td>継続率85%。勝利時8%でストック獲得</td></tr>
      <tr><th>反撃ZONE</th><td>5G。引き戻し率 ${SETS.map(s=>`設定${s} ${pct(hikiRate(s),1)}`).join(' / ')}。強レア30%・弱レア8%で追加当選</td></tr>
    </table>`;
  },
  hint(){
    const ends=ENDINGS.map(e=>{const w=SETS.map(s=>{const tot=ENDINGS.reduce((a,x)=>a+x.w[s-1],0);return e.w[s-1]/tot;});return trow(`${e.id==='all'?'全員集合':CHARS[e.id].short}<br><small>${e.hint}</small>`,w.map(x=>x?pct(x,1):'-'));}).join('');
    const fx=SPEC_SIM&&SPEC_SIM.fx;
    const COL=['','青','緑','赤','金','虹'];
    return`
    <h3>演出の期待度（色）</h3>
    <table><tr><th>色</th><th class="r">通常時のレア役期待度</th></tr>
      ${[1,2,3,4,5].map(l=>`<tr><th><span class="cc c${l}">${COL[l]}</span></th><td class="r">${l===5?'当たり確定':fx&&fx[l]!=null?pct(fx[l],0):'-'}</td></tr>`).join('')}
    </table>
    <p class="note">予告カットイン・セリフの文字色・ステップアップ・枠ランプ・第3停止ボタン・PUSHボタンで共通。</p>
    <h3>演出一覧</h3>
    <table>
      <tr><th>消灯・役物落下</th><td>赤以上で出現</td></tr>
      <tr><th>リールフラッシュ</th><td>白＝弱レア役 / 金＝強レア役 / 虹＝7揃い・プレミア目（確定）</td></tr>
      <tr><th>PUSHボタン</th><td>白銀＝通常 / 赤・金＝チャンス / 虹＝AT確定</td></tr>
      <tr><th>PUSH連打</th><td>当たりのとき出やすい（当たり45% / ハズレ12%）</td></tr>
      <tr><th>次回予告</th><td>タイトルの色が赤・金ならチャンス</td></tr>
      <tr><th>リール逆回転</th><td>フリーズ（プレミア）</td></tr>
      <tr><th>背景</th><td>夜＝低確 / 夕焼け＝高確 / 赤い月＝超高確</td></tr>
    </table>
    <h3>終了画面キャラの出現率</h3>
    <table>${setHead('キャラ')}${ends}</table>
    <h3>トロフィー（AT終了時 15%）</h3>
    <table>${TROPHY.map(t=>`<tr><th>${t.n}</th><td>設定${t.min}以上${t.min===6?'濃厚':'確定'}</td></tr>`).join('')}</table>
    <h3>立ち回りの目安</h3>
    <table>
      <tr><th>天井狙い</th><td>モードAでも${TENJO.A}Gで天井。ハマリ400G以上なら天井までの距離が短くなります</td></tr>
      <tr><th>ヤメ時</th><td>AT終了後の反撃ZONE（5G）を消化して、前兆がなければヤメ</td></tr>
      <tr><th>設定推測</th><td>弱チェリー確率・CZ成功率・終了画面・トロフィー</td></tr>
    </table>`;
  },
  play(){
    return`
    <h3>操作</h3>
    LEVER → STOP×3。PCならスペースキーでレバー、J/K/L（または1/2/3）でストップ、Pでプッシュ。<br>メダルがなくなったら右上の「貸出」（1000円で50枚、架空のお金）。
    <h3>ゲームの流れ</h3>
    通常時にレア役や周期でCZ・ATを抽選 → 前兆で告知 → CZ成功かAT直撃でREIJIN RUSHへ。<br>
    RUSH中は押し順ナビに従ってメダルを増やし、SET終了ごとの決戦バトルに勝てば継続します。<br>
    詳しい数値は「スペック」「通常時」「AT」タブを見てください。`;
  },
};
let anaTab='spec';
function openAnalysis(tab){
  if(tab)anaTab=tab;
  const tabs=[['spec','スペック'],['flow','フロー'],['normal','通常時'],['at','AT'],['hint','演出・示唆'],['play','遊び方']];
  openModal('解析',`<div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${k===anaTab?'on':''}" data-ana="${k}">${n}</button>`).join('')}</div><div class="ana">${ANA[anaTab]()}</div>`);
  $('#mbody').scrollTop=0;
}
$('#mbody').addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.sw){S[t.dataset.sw]=!S[t.dataset.sw];jsave(SSAVE,S);ac();applyVol();BGM.update();openMenu();}
  else if(t.id==='bSounds')openSounds();
  else if(t.dataset.splay)previewSound(t.dataset.splay);
  else if(t.dataset.scopy){const x=SOUNDS.find(y=>y.key===t.dataset.scopy);if(await copyText(x.prompt)){t.textContent='✓済';toast(`${x.label} のプロンプトをコピーしました`);}else{const b=document.querySelector('#mbody .prompt');b.textContent=x.prompt;b.scrollIntoView({block:'center'});toast('コピーできませんでした。上の文章を長押しして選択してください');}}
  else if(t.dataset.sdel){const k=t.dataset.sdel;await DB.del(k,'snd');delete SND.buf[k];delete SND.src[k];if(BGM.fileKey[BGM.song]===k){BGM.song=undefined;BGM.update();}openSounds();}
  else if(t.dataset.set!=null){if(busy)return toast('ゲーム中は変更できません');const s=+t.dataset.set||1+rint(6);if(+t.dataset.set===0){S.showSet=false;jsave(SSAVE,S);}
    M.setting=s;toNormal();M.hamari=0;save();render();toast(+t.dataset.set?`設定${s}に変更しました`:'ランダム設定にしました（非公開）');openMenu();}
  else if(t.id==='bHelp')openAnalysis();
  else if(t.dataset.ana)openAnalysis(t.dataset.ana);
  else if(t.dataset.vcopy){const v=VOICES.find(y=>y.key===t.dataset.vcopy);if(await copyText(v.line)){t.textContent='✓済';toast('セリフをコピーしました');}else toast(`コピーできませんでした: ${v.line}`);}
  else if(t.id==='bResetData'){if(busy)return;if(confirm('データカウンターとメダルをリセットしますか？')){const s=M.setting;M=newState(s);save();render();closeModal();}}
  else if(t.dataset.copy){const id=t.dataset.copy;
    if(await copyText(prompt(id))){t.textContent='✓済';toast(`${CHARS[id].name} のプロンプトをコピーしました`);}
    else{const box=document.querySelector('#mbody .prompt .hl');box.textContent=prompt(id);box.scrollIntoView({block:'center'});toast('コピーできませんでした。例の文章を長押しして選択してください');}}
  else if(t.dataset.del){await DB.del(t.dataset.del);delete imgSrc[t.dataset.del];await loadImages();openChars();}
});
$('#mbody').addEventListener('input',e=>{const k=e.target.dataset.vol;if(!k)return;S[k]=+e.target.value;jsave(SSAVE,S);applyVol();});
$('#mbody').addEventListener('change',async e=>{
  if(e.target.dataset.sup&&e.target.files[0])return uploadSound(e.target.dataset.sup,e.target.files[0]);
  const id=e.target.dataset.up;if(!id||!e.target.files[0])return;
  try{const d=await fileToDataURL(e.target.files[0]);await DB.put(id,d);imgSrc[id]=d;lastChars={};render();openChars();toast(`${CHARS[id].name} を登録しました`);}
  catch(err){toast('画像を読み込めませんでした');}
});

/* ================= input ================= */
function stopAuto(){auto=false;render();}
$('#lever').addEventListener('click',lever);
document.querySelectorAll('.stop').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();pressStop(+b.dataset.r);}));
$('#push').addEventListener('click',doPush);
$('#ov').addEventListener('click',()=>{if(ovSkip)ovSkip();});
$('#bLend').addEventListener('click',()=>{if(busy&&!G)return;M.credits+=50;M.invest+=1000;save();render();toast('1000円分（50枚）貸出しました ※架空');});
$('#bAuto').addEventListener('click',()=>{auto=!auto;render();if(auto&&!busy)lever();if(auto&&pushRes)doPush();});
$('#bData').addEventListener('click',openData);
$('#bMenu').addEventListener('click',openMenu);
$('#bChars').addEventListener('click',openChars);
$('#mclose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{
  if(!$('#modal').classList.contains('hide'))return;
  const k=e.key.toLowerCase();
  if(k===' '||k==='enter'){e.preventDefault();if(pushRes)doPush();else if(ovSkip)ovSkip();else lever();}
  else if(k==='j'||k==='1')pressStop(0);else if(k==='k'||k==='2')pressStop(1);else if(k==='l'||k==='3')pressStop(2);
  else if(k==='p')doPush();
});
window.addEventListener('resize',()=>{measure();FX.resize();});

buildReels();FX.init();dispCredit=M.credits;updSegs();render();requestAnimationFrame(frame);loadImages().then(()=>SND.load());
</script>
</body>
</html>
